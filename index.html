
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAZ Linux V13</title>
<style>
:root{
 --bg:#101113;--panel:#191b1f;--panel2:#22252a;
 --red:#c62828;--red2:#8f1717;--gold:#d6ad55;
 --text:#f1f1f1;--muted:#a5a5a5;--border:#383b40;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,Helvetica,sans-serif;overflow:hidden;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#setup{
 position:fixed;inset:0;z-index:1000;background:#101113;
 display:flex;align-items:center;justify-content:center;padding:20px;
}
.setup-card{
 width:min(440px,100%);background:var(--panel);
 border:1px solid var(--border);border-top:4px solid var(--red);
 padding:30px;border-radius:12px;
}
.logo{font-weight:900;font-size:35px;letter-spacing:3px}
.logo span{color:var(--red)}
.star{color:var(--gold);font-size:28px}
.setup-card p{color:var(--muted);line-height:1.5}
.setup-card label{display:block;margin:17px 0 7px;color:var(--gold)}
.setup-card input,.setup-card select{
 width:100%;padding:12px;background:#101113;color:white;
 border:1px solid var(--border);border-radius:6px;
}
.primary{
 background:var(--red);color:white;border:0;padding:12px 17px;
 border-radius:6px;font-weight:bold;
}
.primary:hover{background:var(--red2)}
#desktop{
 position:fixed;inset:0 0 48px 0;
 background:
 radial-gradient(ellipse at 50% 45%,#292b2d 0%,#151719 48%,#0c0d0e 100%);
 overflow:hidden;
}
.desktop-mark{
 position:absolute;right:35px;bottom:25px;text-align:right;
 opacity:.12;pointer-events:none;
}
.desktop-mark strong{font-size:60px;letter-spacing:8px}
.desktop-mark div{letter-spacing:5px}
#desktopIcons{
 display:grid;grid-template-columns:repeat(2,85px);
 grid-auto-rows:90px;gap:8px;padding:18px;width:190px;
}
.desk-icon{
 border:1px solid transparent;background:transparent;color:white;
 display:flex;flex-direction:column;align-items:center;gap:7px;
 border-radius:7px;padding:8px;font-size:12px;
}
.desk-icon:hover{background:#ffffff15;border-color:#ffffff20}
.desk-icon span{font-size:29px}
#taskbar{
 position:fixed;bottom:0;left:0;right:0;height:48px;
 background:#151619;border-top:1px solid var(--border);
 display:flex;align-items:center;padding:0 10px;gap:8px;z-index:500;
}
#startBtn,.task-btn,.tray-btn{
 border:0;background:transparent;color:white;border-radius:5px;
 padding:8px 12px;
}
#startBtn{background:var(--red);font-weight:bold}
#startBtn:hover{background:var(--red2)}
#taskButtons{display:flex;gap:4px;flex:1;overflow:auto}
.task-btn{background:#292b30;white-space:nowrap;font-size:12px}
.task-btn.active{border-bottom:2px solid var(--red)}
#clockArea{font-size:12px;text-align:right;min-width:75px;line-height:1.4}
#startMenu{
 position:fixed;bottom:55px;left:8px;width:min(360px,95vw);
 max-height:75vh;overflow:auto;background:var(--panel);
 border:1px solid var(--border);border-radius:10px;
 z-index:600;padding:16px;box-shadow:0 12px 40px #0009;
}
.start-head{display:flex;align-items:center;justify-content:space-between}
.start-head strong{font-size:19px}
#appSearch{
 width:100%;margin:15px 0;padding:11px;background:#101113;
 border:1px solid var(--border);color:white;border-radius:6px;
}
.app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.app-item{
 background:var(--panel2);border:1px solid transparent;
 color:white;border-radius:7px;padding:12px 4px;
 display:flex;flex-direction:column;align-items:center;gap:7px;
 font-size:12px;
}
.app-item:hover{border-color:var(--red);background:#303238}
.app-item span{font-size:24px}
.start-footer{display:flex;justify-content:space-between;margin-top:14px}
.window{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:min(700px,94vw);height:min(480px,78vh);
 background:var(--panel);border:1px solid #45484e;
 border-radius:9px;overflow:hidden;display:flex;flex-direction:column;
 box-shadow:0 15px 50px #0009;z-index:20;
}
.window.maximized{
 left:0;top:0;transform:none;width:100%;height:100%;border-radius:0;
}
.win-title{
 height:42px;min-height:42px;background:#222429;
 display:flex;align-items:center;padding:0 10px;gap:9px;
 cursor:move;border-bottom:1px solid var(--border);
}
.win-title strong{flex:1;font-size:13px}
.win-controls{display:flex;gap:5px}
.win-controls button{
 width:27px;height:25px;border:0;border-radius:4px;
 background:#393c42;color:white;
}
.win-controls button.close{background:var(--red)}
.win-body{padding:16px;overflow:auto;flex:1}
.panel{
 background:var(--panel2);border:1px solid var(--border);
 padding:13px;border-radius:7px;margin-bottom:10px;
}
.muted{color:var(--muted)}
.red{color:var(--red)}
.gold{color:var(--gold)}
.big-number{font-size:32px;font-weight:bold}
.action{
 background:#30333a;border:1px solid var(--border);
 color:white;padding:9px 12px;border-radius:5px;margin:3px;
}
.action:hover{border-color:var(--red)}
.field{
 width:100%;padding:10px;background:#101113;color:white;
 border:1px solid var(--border);border-radius:5px;margin:5px 0;
}
textarea.field{resize:vertical;min-height:150px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list-item{
 padding:10px;border-bottom:1px solid var(--border);
 display:flex;align-items:center;gap:8px;
}
.list-item span:first-child{flex:1}
#notifications{
 position:fixed;right:12px;bottom:58px;width:min(320px,90vw);
 background:var(--panel);border:1px solid var(--border);
 border-radius:8px;padding:14px;z-index:700;
}
#quickPanel{
 position:fixed;right:10px;bottom:55px;width:min(300px,90vw);
 background:var(--panel);border:1px solid var(--border);
 border-radius:8px;padding:14px;z-index:700;
}
#toast{
 position:fixed;bottom:65px;left:50%;transform:translateX(-50%);
 background:#292b30;border:1px solid var(--gold);padding:10px 16px;
 border-radius:7px;z-index:999;display:none;font-size:13px;
}
hr{border:0;border-top:1px solid var(--border);margin:14px 0}
a{color:var(--gold)}
@media(max-width:600px){
 #desktopIcons{grid-template-columns:repeat(2,70px)}
 .window{width:96vw;height:82vh}
 #taskbar{gap:3px;padding:0 4px}
 #startBtn{padding:8px}
 #clockArea{min-width:58px}
 .task-btn{padding:7px}
}
</style>
</head>
<body>

<div id="setup">
 <div class="setup-card">
  <div class="star">★</div>
  <div class="logo">DAZ <span>LINUX</span></div>
  <h2 id="setupTitle">Configuración inicial</h2>
  <p id="setupDesc">Bienvenido al escritorio DAZ Linux V13 Soviet Edition.</p>
  <label id="languageLabel">Idioma del sistema</label>
  <select id="language">
   <option value="es">Español</option>
   <option value="en">English</option>
   <option value="fr">Français</option>
   <option value="ru">Русский</option>
  </select>
  <label id="userLabel">Nombre de usuario</label>
  <input id="username" maxlength="20" placeholder="Tu nombre">
  <br><br>
  <button class="primary" style="width:100%" onclick="finishSetup()" id="setupButton">Iniciar DAZ Linux</button>
  <p class="muted" style="font-size:11px">DAZ Linux V13 · Soviet Edition</p>
 </div>
</div>

<div id="desktop" class="hidden">
 <div id="desktopIcons">
  <button class="desk-icon" onclick="openApp('files')"><span>📁</span>Archivos</button>
  <button class="desk-icon" onclick="openApp('terminal')"><span>⌨️</span>Terminal</button>
  <button class="desk-icon" onclick="openApp('notes')"><span>📝</span>Notas</button>
  <button class="desk-icon" onclick="openApp('browser')"><span>🌐</span>Navegador</button>
  <button class="desk-icon" onclick="openApp('software')"><span>🛍️</span>Software</button>
  <button class="desk-icon" onclick="openApp('settings')"><span>⚙️</span>Ajustes</button>
 </div>
 <div class="desktop-mark"><strong>★ DAZ</strong><div>SOVIET EDITION</div></div>
</div>

<div id="taskbar" class="hidden">
 <button id="startBtn" onclick="toggleStart()">★ DAZ</button>
 <div id="taskButtons"></div>
 <button class="tray-btn" onclick="toggleQuick()">⚙</button>
 <button class="tray-btn" onclick="toggleNotifications()">🔔</button>
 <div id="clockArea"><span id="clock">00:00</span><br><span id="date"></span></div>
</div>

<div id="startMenu" class="hidden">
 <div class="start-head">
  <strong>★ DAZ Linux</strong>
  <span class="muted" id="startUser"></span>
 </div>
 <input id="appSearch" placeholder="Buscar aplicaciones..." oninput="filterApps()">
 <div class="app-grid" id="appGrid"></div>
 <hr>
 <div class="start-footer">
  <button class="action" onclick="openApp('settings')">⚙ Ajustes</button>
  <button class="action" onclick="logout()">⏻ Cerrar sesión</button>
 </div>
</div>

<div id="quickPanel" class="hidden">
 <h3>⚙ Ajustes rápidos</h3>
 <div class="row">
  <button class="action" onclick="toggleTheme()">🌗 Tema</button>
  <button class="action" onclick="openApp('settings')">🎨 Personalizar</button>
  <button class="action" onclick="notify('DAZ Linux está funcionando')">ℹ Sistema</button>
 </div>
 <hr>
 <div class="muted">DAZ Linux V13 · Soviet Edition</div>
</div>

<div id="notifications" class="hidden">
 <div class="row"><strong style="flex:1">Notificaciones</strong>
 <button class="action" onclick="clearNotifications()">Limpiar</button></div>
 <div id="notificationList" class="muted">No hay notificaciones.</div>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const translations={
 es:{search:"Buscar aplicaciones...",files:"Archivos",terminal:"Terminal",notes:"Notas",browser:"Navegador",software:"Centro de software",settings:"Ajustes",calculator:"Calculadora",tasks:"Tareas",calendar:"Calendario",clock:"Reloj",trash:"Papelera",system:"Información del sistema",manager:"Administrador de tareas",counter:"Contador de visitas",games:"Centro de juegos",welcome:"Bienvenido",save:"Guardar",add:"Agregar",empty:"Vacío"},
 en:{search:"Search applications...",files:"Files",terminal:"Terminal",notes:"Notes",browser:"Browser",software:"Software Center",settings:"Settings",calculator:"Calculator",tasks:"Tasks",calendar:"Calendar",clock:"Clock",trash:"Trash",system:"System information",manager:"Task manager",counter:"Visit counter",games:"Games hub",welcome:"Welcome",save:"Save",add:"Add",empty:"Empty"},
 fr:{search:"Rechercher des applications...",files:"Fichiers",terminal:"Terminal",notes:"Notes",browser:"Navigateur",software:"Centre logiciel",settings:"Paramètres",calculator:"Calculatrice",tasks:"Tâches",calendar:"Calendrier",clock:"Horloge",trash:"Corbeille",system:"Informations système",manager:"Gestionnaire des tâches",counter:"Compteur de visites",games:"Centre de jeux",welcome:"Bienvenue",save:"Enregistrer",add:"Ajouter",empty:"Vide"},
 ru:{search:"Поиск приложений...",files:"Файлы",terminal:"Терминал",notes:"Заметки",browser:"Браузер",software:"Центр программ",settings:"Настройки",calculator:"Калькулятор",tasks:"Задачи",calendar:"Календарь",clock:"Часы",trash:"Корзина",system:"Информация о системе",manager:"Диспетчер задач",counter:"Счётчик посещений",games:"Игровой центр",welcome:"Добро пожаловать",save:"Сохранить",add:"Добавить",empty:"Пусто"}
};
let lang=localStorage.getItem("daz_lang")||"es";
let username=localStorage.getItem("daz_user")||"";
let windows={};
let zIndex=30;
let visitCount=Number(localStorage.getItem("daz_visits")||0)+1;
localStorage.setItem("daz_visits",visitCount);
let notes=localStorage.getItem("daz_notes")||"";
let tasks=JSON.parse(localStorage.getItem("daz_tasks")||"[]");
let files=JSON.parse(localStorage.getItem("daz_files")||'["Bienvenido.txt","Reglamento.txt","DAZ Linux.txt"]');
let trash=JSON.parse(localStorage.getItem("daz_trash")||"[]");
let notifications=[];

const apps=[
 ["files","📁","files"],["terminal","⌨️","terminal"],
 ["notes","📝","notes"],["browser","🌐","browser"],
 ["software","🛍️","software"],["settings","⚙️","settings"],
 ["calculator","🧮","calculator"],["tasks","☑️","tasks"],
 ["calendar","📅","calendar"],["clock","⏱️","clock"],
 ["trash","🗑️","trash"],["system","🖥️","system"],
 ["manager","📊","manager"],["counter","👁️","counter"],
 ["games","🎮","games"]
];
function tr(k){return (translations[lang]||translations.es)[k]||k}
function save(key,value){localStorage.setItem("daz_"+key,JSON.stringify(value))}
function finishSetup(){
 let name=$("username").value.trim();
 if(!name){toast("Escribe un nombre de usuario");return}
 username=name;lang=$("language").value;
 localStorage.setItem("daz_user",username);
 localStorage.setItem("daz_lang",lang);
 startSystem();
}
function startSystem(){
 $("setup").classList.add("hidden");
 $("desktop").classList.remove("hidden");
 $("taskbar").classList.remove("hidden");
 $("startUser").textContent=username;
 $("appSearch").placeholder=tr("search");
 renderApps();updateClock();
 notify(tr("welcome")+", "+username);
}
function renderApps(){
 $("appGrid").innerHTML="";
 apps.forEach(([id,emoji,key])=>{
  let b=document.createElement("button");
  b.className="app-item";b.dataset.name=tr(key).toLowerCase();
  b.innerHTML="<span>"+emoji+"</span>"+tr(key);
  b.onclick=()=>openApp(id);
  $("appGrid").appendChild(b);
 });
}
function filterApps(){
 let q=$("appSearch").value.toLowerCase();
 document.querySelectorAll(".app-item").forEach(b=>{
  b.style.display=b.dataset.name.includes(q)?"flex":"none";
 });
}
function toggleStart(){
 $("startMenu").classList.toggle("hidden");
 $("quickPanel").classList.add("hidden");
 $("notifications").classList.add("hidden");
}
function toggleQuick(){
 $("quickPanel").classList.toggle("hidden");
 $("startMenu").classList.add("hidden");
 $("notifications").classList.add("hidden");
}
function toggleNotifications(){
 $("notifications").classList.toggle("hidden");
 $("startMenu").classList.add("hidden");
 $("quickPanel").classList.add("hidden");
}
function toast(msg){
 $("toast").textContent=msg;$("toast").style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>$("toast").style.display="none",2300);
}
function notify(msg){
 notifications.unshift(msg);
 notifications=notifications.slice(0,12);
 $("notificationList").innerHTML=notifications.map(n=>"<div class='list-item'>🔔 "+escapeHTML(n)+"</div>").join("");
}
function clearNotifications(){notifications=[];$("notificationList").textContent="No hay notificaciones."}
function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function updateClock(){
 let d=new Date();
 $("clock").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
 $("date").textContent=d.toLocaleDateString();
}
setInterval(updateClock,1000);

function openApp(id){
 $("startMenu").classList.add("hidden");
 $("quickPanel").classList.add("hidden");
 $("notifications").classList.add("hidden");
 if(windows[id]){
  windows[id].style.display="flex";
  windows[id].style.zIndex=++zIndex;
  updateTaskButtons();return;
 }
 let info=apps.find(a=>a[0]===id);
 if(!info)return;
 let win=document.createElement("div");
 win.className="window";win.dataset.app=id;
 win.style.zIndex=++zIndex;
 win.innerHTML=`
 <div class="win-title">
  <span>${info[1]}</span><strong>${tr(info[2])}</strong>
  <div class="win-controls">
   <button title="Minimizar" data-action="min">−</button>
   <button title="Maximizar" data-action="max">□</button>
   <button class="close" title="Cerrar" data-action="close">×</button>
  </div>
 </div><div class="win-body">${appContent(id)}</div>`;
 $("desktop").appendChild(win);
 windows[id]=win;
 win.querySelector('[data-action="close"]').onclick=()=>closeApp(id);
 win.querySelector('[data-action="min"]').onclick=()=>{win.style.display="none";updateTaskButtons()};
 win.querySelector('[data-action="max"]').onclick=()=>win.classList.toggle("maximized");
 win.addEventListener("mousedown",()=>{win.style.zIndex=++zIndex;updateTaskButtons()});
 makeDraggable(win);
 updateTaskButtons();
 initApp(id,win);
}
function closeApp(id){
 if(windows[id])windows[id].remove();
 delete windows[id];updateTaskButtons();
}
function updateTaskButtons(){
 $("taskButtons").innerHTML="";
 Object.keys(windows).forEach(id=>{
  let a=apps.find(x=>x[0]===id);
  let b=document.createElement("button");
  b.className="task-btn"+(windows[id].style.display==="none"?"":" active");
  b.textContent=a[1]+" "+tr(a[2]);
  b.onclick=()=>{
   let w=windows[id];
   if(w.style.display==="none"){w.style.display="flex";w.style.zIndex=++zIndex}
   else w.style.display="none";
   updateTaskButtons();
  };
  $("taskButtons").appendChild(b);
 });
}
function makeDraggable(win){
 let bar=win.querySelector(".win-title"),drag=false,dx=0,dy=0;
 bar.addEventListener("pointerdown",e=>{
  if(e.target.closest("button")||win.classList.contains("maximized"))return;
  drag=true;dx=e.clientX-win.offsetLeft;dy=e.clientY-win.offsetTop;
  bar.setPointerCapture(e.pointerId);
 });
 bar.addEventListener("pointermove",e=>{
  if(!drag)return;
  win.style.left=(e.clientX-dx+win.offsetWidth/2)+"px";
  win.style.top=(e.clientY-dy+win.offsetHeight/2)+"px";
  win.style.transform="translate(-50%,-50%)";
 });
 bar.addEventListener("pointerup",()=>drag=false);
}

function appContent(id){
 switch(id){
 case "files":return `<h2>📁 ${tr("files")}</h2><p class="muted">Almacenamiento virtual local</p><div class="panel" id="fileList"></div><div class="row"><input class="field" id="newFile" placeholder="Nombre del archivo"><button class="primary" onclick="addFile()">＋ Crear</button></div><p class="muted">Los archivos son virtuales y se guardan en este navegador.</p>`;
 case "terminal":return `<h2>⌨️ DAZ Terminal</h2><div class="panel" style="background:#080909;font-family:monospace;height:220px;overflow:auto" id="termOutput">DAZ Linux V13 [Simulated Terminal]<br>Escribe <b>help</b> para ver comandos.<br></div><input class="field" id="termInput" placeholder="daz@linux:~$" onkeydown="if(event.key==='Enter')runTerminal()">`;
 case "notes":return `<h2>📝 ${tr("notes")}</h2><textarea id="notesArea" class="field" style="height:260px" placeholder="Escribe tus notas..."></textarea><button class="primary" onclick="saveNotes()">Guardar notas</button><span class="muted" id="notesStatus"></span>`;
 case "browser":return `<h2>🌐 DAZ Web</h2><p class="muted">Accesos directos a sitios web</p><input id="webAddress" class="field" placeholder="https://example.com"><button class="primary" onclick="goWeb()">Abrir dirección</button><hr><div class="app-grid">${[['Google','https://google.com','🔎'],['YouTube','https://youtube.com','▶️'],['Wikipedia','https://wikipedia.org','📚'],['GitHub','https://github.com','💻'],['DuckDuckGo','https://duckduckgo.com','🦆'],['Roblox','https://roblox.com','🎮']].map(x=>`<button class="app-item" onclick="window.open('${x[1]}','_blank','noopener')"><span>${x[2]}</span>${x[0]}</button>`).join("")}</div><p class="muted">Los sitios se abren en otra pestaña del navegador.</p>`;
 case "software":return `<h2>🛍️ Centro de software</h2><p class="muted">Aplicaciones y herramientas recomendadas</p>${[['Visual Studio Code','Editor de código','https://code.visualstudio.com/'],['Firefox','Navegador web','https://www.mozilla.org/firefox/'],['GIMP','Editor de imágenes','https://www.gimp.org/'],['VLC','Reproductor multimedia','https://www.videolan.org/'],['LMMS','Producción musical','https://lmms.io/'],['GitHub','Proyectos y código','https://github.com/']].map(x=>`<div class="list-item"><span><b>${x[0]}</b><br><small class="muted">${x[1]}</small></span><button class="action" onclick="window.open('${x[2]}','_blank','noopener')">Visitar</button></div>`).join("")}`;
 case "settings":return `<h2>⚙️ Ajustes del sistema</h2><div class="panel"><b>Personalización</b><p><button class="action" onclick="toggleTheme()">Cambiar tema claro/oscuro</button></p><label>Color de acento</label><input type="color" id="accentColor" value="${getComputedStyle(document.documentElement).getPropertyValue('--red').trim()}" onchange="setAccent(this.value)"><p><label>Fondo de escritorio</label></p><select class="field" onchange="setWallpaper(this.value)"><option value="default">Soviético oscuro</option><option value="red">Rojo oscuro</option><option value="blue">Azul nocturno</option><option value="black">Negro clásico</option></select></div><div class="panel"><b>Idioma</b><select class="field" id="changeLang"><option value="es">Español</option><option value="en">English</option><option value="fr">Français</option><option value="ru">Русский</option></select><button class="action" onclick="changeLanguage()">Aplicar idioma</button></div><div class="panel"><b>Usuario</b><p>${escapeHTML(username)}</p><button class="action" onclick="changeUser()">Cambiar usuario</button></div><div class="panel"><b>Almacenamiento</b><p>Datos guardados en el navegador mediante localStorage.</p><button class="action" onclick="exportBackup()">Exportar copia de seguridad</button><button class="action" onclick="importBackup()">Importar copia</button></div>`;
 case "calculator":return `<h2>🧮 Calculadora</h2><input id="calcDisplay" class="field" placeholder="0" readonly><div class="app-grid">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+','C','⌫','(',')'].map(v=>`<button class="action" onclick="calcPress('${v}')">${v}</button>`).join("")}</div>`;
 case "tasks":return `<h2>☑️ ${tr("tasks")}</h2><div class="row"><input id="taskInput" class="field" placeholder="Nueva tarea..."><button class="primary" onclick="addTask()">＋</button></div><div id="taskList"></div>`;
 case "calendar":return `<h2>📅 Calendario</h2><div class="panel"><div class="big-number" id="calendarDay"></div><div id="calendarMonth"></div></div><p class="muted">Fecha local del dispositivo.</p>`;
 case "clock":return `<h2>⏱️ ${tr("clock")}</h2><div class="panel" style="text-align:center"><div class="big-number" id="clockBig">00:00:00</div><div class="muted">Hora local</div></div><div class="panel"><h3>Cronómetro</h3><div class="big-number" id="stopwatch">00:00.0</div><button class="primary" onclick="startStopwatch()">Iniciar / Pausar</button><button class="action" onclick="resetStopwatch()">Reiniciar</button></div>`;
 case "trash":return `<h2>🗑️ ${tr("trash")}</h2><div id="trashList"></div><button class="action" onclick="emptyTrash()">Vaciar papelera</button>`;
 case "system":return `<h2>🖥️ DAZ System Information</h2><div class="panel"><div class="big-number">V13</div><b>DAZ Linux Soviet Edition</b><p>Interfaz de escritorio web</p></div><div class="list-item">Usuario: ${escapeHTML(username)}</div><div class="list-item">Idioma: ${lang.toUpperCase()}</div><div class="list-item">Navegador: ${escapeHTML(navigator.userAgent.slice(0,90))}</div><div class="list-item">Pantalla: ${screen.width} × ${screen.height}</div><div class="list-item">Visitas: ${visitCount}</div><div class="list-item">Motor: HTML / CSS / JavaScript</div><p class="muted">No es una distribución Linux real. Es un escritorio web.</p>`;
 case "manager":return `<h2>📊 Administrador de tareas</h2><div class="panel"><div class="big-number" id="openWindows">0</div>Ventanas abiertas</div><div id="managerList"></div><button class="action" onclick="refreshManager()">Actualizar</button>`;
 case "counter":return `<h2>👁️ Contador de visitas</h2><div class="panel"><div class="big-number">${visitCount}</div>Visitas registradas en este navegador</div><p class="muted">El contador es local, no representa visitas globales de GitHub.</p><button class="action" onclick="resetVisits()">Reiniciar contador</button>`;
 case "games":return `<h2>🎮 DAZ Gaming Hub</h2><p class="muted">Accesos a plataformas de juegos</p><div class="app-grid">${[['Roblox','https://www.roblox.com/','🎮'],['Minecraft','https://www.minecraft.net/','⛏️'],['Steam','https://store.steampowered.com/','🕹️'],['Epic Games','https://store.epicgames.com/','🎯'],['itch.io','https://itch.io/','👾'],['Game Jolt','https://gamejolt.com/','🎲']].map(x=>`<button class="app-item" onclick="window.open('${x[1]}','_blank','noopener')"><span>${x[2]}</span>${x[0]}</button>`).join("")}</div>`;
 default:return `<h2>DAZ Linux</h2><p>Aplicación no disponible.</p>`;
 }
}
function initApp(id,win){
 if(id==="notes")$("notesArea").value=notes;
 if(id==="tasks")renderTasks();
 if(id==="files")renderFiles();
 if(id==="trash")renderTrash();
 if(id==="calendar"){
  let d=new Date();$("calendarDay").textContent=d.getDate();
  $("calendarMonth").textContent=d.toLocaleDateString(lang,{month:"long",year:"numeric"});
 }
 if(id==="clock")startClockDisplay();
 if(id==="manager")refreshManager();
 if(id==="settings")$("changeLang").value=lang;
}
function saveNotes(){
 notes=$("notesArea").value;localStorage.setItem("daz_notes",notes);
 $("notesStatus").textContent=" Guardado ✓";toast("Notas guardadas");
}
function addTask(){
 let v=$("taskInput").value.trim();if(!v)return;
 tasks.push({text:v,done:false});save("tasks",tasks);
 $("taskInput").value="";renderTasks();
}
function renderTasks(){
 if(!$("taskList"))return;
 $("taskList").innerHTML=tasks.length?tasks.map((t,i)=>`<div class="list-item"><input type="checkbox" ${t.done?"checked":""} onchange="toggleTask(${i})"><span style="${t.done?"text-decoration:line-through;opacity:.5":""}">${escapeHTML(t.text)}</span><button class="action" onclick="deleteTask(${i})">×</button></div>`).join(""):"<p class='muted'>No hay tareas.</p>";
}
function toggleTask(i){tasks[i].done=!tasks[i].done;save("tasks",tasks);renderTasks()}
function deleteTask(i){tasks.splice(i,1);save("tasks",tasks);renderTasks()}
function addFile(){
 let v=$("newFile").value.trim();if(!v)return;
 files.push(v);save("files",files);$("newFile").value="";renderFiles();
}
function renderFiles(){
 if(!$("fileList"))return;
 $("fileList").innerHTML=files.length?files.map((f,i)=>`<div class="list-item"><span>📄 ${escapeHTML(f)}</span><button class="action" onclick="deleteFile(${i})">🗑️</button></div>`).join(""):"<p class='muted'>No hay archivos.</p>";
}
function deleteFile(i){trash.push(files.splice(i,1)[0]);save("files",files);save("trash",trash);renderFiles()}
function renderTrash(){
 if(!$("trashList"))return;
 $("trashList").innerHTML=trash.length?trash.map((f,i)=>`<div class="list-item"><span>📄 ${escapeHTML(f)}</span><button class="action" onclick="restoreTrash(${i})">Restaurar</button></div>`).join(""):"<p class='muted'>Papelera vacía.</p>";
}
function restoreTrash(i){files.push(trash.splice(i,1)[0]);save("files",files);save("trash",trash);renderTrash()}
function emptyTrash(){trash=[];save("trash",trash);renderTrash();toast("Papelera vaciada")}
function runTerminal(){
 let input=$("termInput"),out=$("termOutput"),cmd=input.value.trim().toLowerCase();
 if(!cmd)return;
 let result={
  help:"Comandos: help, about, date, time, whoami, clear, neofetch, apps, version",
  about:"DAZ Linux V13 Soviet Edition — escritorio web simulado.",
  date:new Date().toLocaleDateString(),
  time:new Date().toLocaleTimeString(),
  whoami:username,
  neofetch:"★ DAZ LINUX V13<br>OS: Web Desktop<br>Edition: Soviet<br>Shell: DAZ Simulated Shell",
  apps:apps.map(a=>a[0]).join(", "),
  version:"DAZ Linux V13"
 };
 if(cmd==="clear")out.innerHTML="";
 else out.innerHTML+="<br><span style='color:#d6ad55'>daz@linux:~$</span> "+escapeHTML(input.value)+"<br>"+(result[cmd]||"Comando desconocido. Escribe help.")+"<br>";
 input.value="";out.scrollTop=out.scrollHeight;
}
function calcPress(v){
 let d=$("calcDisplay");
 if(v==="C")d.value="";
 else if(v==="⌫")d.value=d.value.slice(0,-1);
 else if(v==="="){
  try{
   let exp=d.value.replace(/×/g,"*").replace(/÷/g,"/");
   if(!/^[0-9+\-*/(). ]+$/.test(exp))throw Error();
   let tokens=exp.match(/\d+\.?\d*|[()+\-*/]/g)||[];
   let p=0;
   function expr(){
    let n=term();
    while(tokens[p]==="+"||tokens[p]==="-"){let op=tokens[p++],r=term();n=op==="+"?n+r:n-r}
    return n;
   }
   function term(){
    let n=factor();
    while(tokens[p]==="*"||tokens[p]==="/"){let op=tokens[p++],r=factor();if(op==="/"&&r===0)throw Error();n=op==="*"?n*r:n/r}
    return n;
   }
   function factor(){
    let t=tokens[p++];
    if(t==="-")return -factor();
    if(t==="+")return factor();
    if(t==="("){let n=expr();if(tokens[p++]!==")")throw Error();return n}
    if(!t||!/^\d+\.?\d*$/.test(t))throw Error();
    return Number(t);
   }
   let ans=expr();if(p!==tokens.length||!Number.isFinite(ans))throw Error();
   d.value=String(Number(ans.toFixed(8)));
  }catch(e){d.value="Error"}
 }else d.value+=v;
}
let swStart=0,swElapsed=0,swRunning=false,swInterval=null;
function startStopwatch(){
 if(swRunning){swElapsed+=Date.now()-swStart;swRunning=false;clearInterval(swInterval)}
 else{swStart=Date.now();swRunning=true;swInterval=setInterval(updateSW,100)}
 updateSW();
}
function updateSW(){
 let ms=swElapsed+(swRunning?Date.now()-swStart:0);
 if($("stopwatch"))$("stopwatch").textContent=(ms/60000|0).toString().padStart(2,"0")+":"+((ms/1000|0)%60).toString().padStart(2,"0")+"."+((ms%1000/100)|0);
}
function resetStopwatch(){swRunning=false;swElapsed=0;clearInterval(swInterval);updateSW()}
function startClockDisplay(){
 if(window.bigClockTimer)clearInterval(window.bigClockTimer);
 function tick(){if($("clockBig"))$("clockBig").textContent=new Date().toLocaleTimeString()}
 tick();window.bigClockTimer=setInterval(tick,1000);
}
function goWeb(){
 let url=$("webAddress").value.trim();
 if(!/^https?:\/\//i.test(url))url="https://"+url;
 try{let parsed=new URL(url);if(!["http:","https:"].includes(parsed.protocol))throw Error();window.open(parsed.href,"_blank","noopener")}
 catch(e){toast("Dirección no válida")}
}
function refreshManager(){
 if(!$("managerList"))return;
 $("openWindows").textContent=Object.keys(windows).length;
 $("managerList").innerHTML=Object.keys(windows).map(id=>`<div class="list-item">${escapeHTML(id)} <span class="muted">${windows[id].style.display==="none"?"Minimizada":"Activa"}</span></div>`).join("");
}
function resetVisits(){
 visitCount=0;localStorage.setItem("daz_visits",0);
 closeApp("counter");openApp("counter");
}
function toggleTheme(){
 let light=document.body.dataset.theme!=="light";
 document.body.dataset.theme=light?"light":"dark";
 if(light){
  document.documentElement.style.setProperty("--bg","#e5e5e5");
  document.documentElement.style.setProperty("--panel","#f5f5f5");
  document.documentElement.style.setProperty("--panel2","#e4e4e4");
  document.documentElement.style.setProperty("--text","#171717");
  document.documentElement.style.setProperty("--muted","#555");
 }else{
  document.documentElement.style.setProperty("--bg","#101113");
  document.documentElement.style.setProperty("--panel","#191b1f");
  document.documentElement.style.setProperty("--panel2","#22252a");
  document.documentElement.style.setProperty("--text","#f1f1f1");
  document.documentElement.style.setProperty("--muted","#a5a5a5");
 }
}
function setAccent(color){document.documentElement.style.setProperty("--red",color);localStorage.setItem("daz_accent",color)}
function setWallpaper(v){
 let bg={
  default:"radial-gradient(ellipse at 50% 45%,#292b2d,#151719 48%,#0c0d0e)",
  red:"linear-gradient(135deg,#260909,#5b1010,#111)",
  blue:"linear-gradient(135deg,#071626,#142c48,#090d14)",
  black:"linear-gradient(135deg,#000,#151515,#050505)"
 };
 $("desktop").style.background=bg[v]||bg.default;
 localStorage.setItem("daz_wallpaper",v);
}
function changeLanguage(){
 lang=$("changeLang").value;localStorage.setItem("daz_lang",lang);
 renderApps();$("appSearch").placeholder=tr("search");
 toast("Idioma actualizado. Algunas ventanas abiertas pueden necesitar reiniciarse.");
}
function changeUser(){
 let n=prompt("Nuevo nombre de usuario:",username);
 if(n&&n.trim()){username=n.trim().slice(0,20);localStorage.setItem("daz_user",username);$("startUser").textContent=username;toast("Usuario actualizado")}
}
function exportBackup(){
 let data={username,lang,notes,tasks,files,trash};
 let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="DAZ-Linux-backup.json";a.click();URL.revokeObjectURL(a.href);
 toast("Copia de seguridad exportada");
}
function importBackup(){
 let picker=document.createElement("input");picker.type="file";picker.accept=".json,application/json";
 picker.onchange=()=>{
  let file=picker.files[0];if(!file)return;
  let reader=new FileReader();
  reader.onload=()=>{
   try{
    let d=JSON.parse(reader.result);
    if(!d||typeof d!=="object")throw Error();
    if(typeof d.notes==="string"){notes=d.notes;localStorage.setItem("daz_notes",notes)}
    if(Array.isArray(d.tasks)){tasks=d.tasks;save("tasks",tasks)}
    if(Array.isArray(d.files)){files=d.files;save("files",files)}
    if(Array.isArray(d.trash)){trash=d.trash;save("trash",trash)}
    toast("Copia importada");
   }catch(e){toast("Archivo de copia no válido")}
  };
  reader.readAsText(file);
 };
 picker.click();
}
function logout(){
 if(!confirm("¿Cerrar sesión?"))return;
 Object.keys(windows).forEach(closeApp);
 $("desktop").classList.add("hidden");$("taskbar").classList.add("hidden");
 $("setup").classList.remove("hidden");$("username").value=username;$("language").value=lang;
}
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){
  $("startMenu").classList.add("hidden");
  $("quickPanel").classList.add("hidden");
  $("notifications").classList.add("hidden");
 }
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){
  e.preventDefault();$("startMenu").classList.remove("hidden");$("appSearch").focus();
 }
});
const savedAccent=localStorage.getItem("daz_accent");
if(savedAccent)document.documentElement.style.setProperty("--red",savedAccent);
const savedWallpaper=localStorage.getItem("daz_wallpaper");
if(savedWallpaper){
 let bg={default:"radial-gradient(ellipse at 50% 45%,#292b2d,#151719 48%,#0c0d0e)",red:"linear-gradient(135deg,#260909,#5b1010,#111)",blue:"linear-gradient(135deg,#071626,#142c48,#090d14)",black:"linear-gradient(135deg,#000,#151515,#050505)"};
 $("desktop").style.background=bg[savedWallpaper]||bg.default;
}
if(username){
 $("setup").classList.add("hidden");
 startSystem();
}
</script>
