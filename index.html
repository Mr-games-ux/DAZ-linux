
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAZ Linux V9</title>

<style>
:root {
  --bg:#171717;
  --panel:#252525;
  --red:#a71920;
  --gold:#c5a45b;
  --text:#eee;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow:hidden;
}
button,select{
  padding:10px;
  background:#333;
  color:white;
  border:1px solid #666;
  cursor:pointer;
  border-radius:4px;
}
button:hover{background:var(--red)}
#desktop{
  height:calc(100vh - 43px);
  padding:15px;
  display:grid;
  grid-template-columns:repeat(auto-fill,90px);
  grid-auto-rows:100px;
  gap:8px;
  align-content:start;
  background:radial-gradient(ellipse,#303030,#151515);
}
.desktop-icon{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:7px;
  text-align:center;
  font-size:12px;
  cursor:pointer;
  border:1px solid transparent;
  border-radius:5px;
  padding:5px;
}
.desktop-icon:hover{
  background:#ffffff20;
  border-color:#888;
}
.symbol{font-size:30px}
#taskbar{
  position:fixed;
  bottom:0;
  width:100%;
  height:43px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:5px 10px;
  background:#202020;
  border-top:2px solid var(--red);
}
#taskLeft,#taskRight{
  display:flex;
  align-items:center;
  gap:10px;
}
#startButton{
  background:var(--red);
  border:1px solid var(--gold);
  font-weight:bold;
}
#clock{color:var(--gold);font-size:13px}
#startMenu{
  display:none;
  position:fixed;
  bottom:48px;
  left:8px;
  width:260px;
  padding:12px;
  background:#222;
  border:1px solid var(--gold);
  border-top:3px solid var(--red);
  z-index:30;
}
#startMenu.open{display:block}
.menu-title{
  color:var(--gold);
  padding:10px;
  border-bottom:1px solid #555;
}
.menu-item{
  display:block;
  width:100%;
  margin-top:5px;
  text-align:left;
}
#window{
  display:none;
  position:fixed;
  z-index:10;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(750px,94vw);
  height:min(540px,78vh);
  background:#222;
  border:1px solid var(--gold);
  box-shadow:0 10px 35px #000b;
  flex-direction:column;
}
#window.show{display:flex}
#windowHeader{
  background:var(--red);
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
#windowContent{
  padding:18px;
  overflow:auto;
  flex:1;
}
.panel{
  background:#303030;
  padding:16px;
  margin-bottom:12px;
  border-left:3px solid var(--red);
}
.big-time{
  text-align:center;
  font-size:38px;
  color:var(--gold);
  margin:20px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px;
}
.grid button{text-align:left}
#languageScreen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
  padding:20px;
}
.language-box{
  width:min(400px,100%);
  padding:30px;
  text-align:center;
  background:#242424;
  border:1px solid var(--gold);
  border-top:5px solid var(--red);
}
.language-box select,.language-box button{
  width:100%;
  margin:10px 0;
}
.hidden{display:none!important}
</style>
</head>

<body>

<!-- SELECTOR DE IDIOMA -->

<div id="languageScreen">
  <div class="language-box">
    <h1>☭ DAZ LINUX V9</h1>
    <p id="languageTitle">Selecciona el idioma</p>

    <select id="languageSelect">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="ru">Русский</option>
    </select>

    <button onclick="bootSystem()" id="bootButton">
      Iniciar sistema
    </button>
  </div>
</div>

<!-- ESCRITORIO -->

<div id="desktop">

  <div class="desktop-icon" onclick="openPage('StudySync')">
    <span class="symbol">📚</span>StudySync
  </div>

  <div class="desktop-icon" onclick="openPage('Classwork Cloud')">
    <span class="symbol">☁️</span>Classwork Cloud
  </div>

  <div class="desktop-icon" onclick="openKiwi()">
    <span class="symbol">🥝</span>Kiwi
  </div>

  <div class="desktop-icon" onclick="openPage('Classwork US')">
    <span class="symbol">📖</span>Classwork US
  </div>

  <div class="desktop-icon" onclick="openPage('Learning')">
    <span class="symbol">🎓</span>Learning
  </div>

  <div class="desktop-icon" onclick="openPage('Biology')">
    <span class="symbol">🧬</span>Biology
  </div>

  <div class="desktop-icon" onclick="openPage('Nettle Web')">
    <span class="symbol">🌐</span>Nettle Web
  </div>

  <div class="desktop-icon" onclick="openGameTime()">
    <span class="symbol">⏱️</span>Game Time
  </div>

  <div class="desktop-icon" onclick="openGaming()">
    <span class="symbol">🎮</span>Gaming Mode
  </div>

  <div class="desktop-icon" onclick="openVisits()">
    <span class="symbol">📊</span>Visit Counter
  </div>

</div>

<!-- MENU -->

<div id="startMenu">
  <div class="menu-title">☭ DAZ LINUX V9</div>

  <button class="menu-item" onclick="openGameTime()">⏱️ Game Time</button>
  <button class="menu-item" onclick="openGaming()">🎮 Gaming Mode</button>
  <button class="menu-item" onclick="openVisits()">📊 Visit Counter</button>
  <button class="menu-item" onclick="openKiwi()">🥝 Kiwi</button>
  <button class="menu-item" onclick="openSettings()">⚙️ Settings</button>
</div>

<!-- VENTANA -->

<div id="window">
  <div id="windowHeader">
    <span id="windowTitle">DAZ Linux</span>
    <button onclick="closeWindow()">✕</button>
  </div>
  <div id="windowContent"></div>
</div>

<!-- BARRA -->

<div id="taskbar">
  <div id="taskLeft">
    <button id="startButton" onclick="toggleStart()">☭ START</button>
    <span>DAZ Linux V9</span>
  </div>

  <div id="taskRight">
    <span id="modeIndicator">NORMAL</span>
    <span id="clock">00:00</span>
  </div>
</div>

<script>

// PÁGINAS PRINCIPALES

const pages={
  "StudySync":"https://studysync.co.uk/",
  "Classwork Cloud":"https://classwork.cloud/",
  "Classwork US":"https://classwork.us.com/",
  "Learning":"https://learning.com.de/",
  "Biology":"https://biology.us.com/",
  "Nettle Web":"https://nettleweb.pages.dev/"
};

// KIWI: ENLACES

// Añade aquí los enlaces originales de Kiwi.
// No se han inventado direcciones.

const kiwiLinks=[];

// IDIOMAS

const translations={
es:{
languageTitle:"Selecciona el idioma del sistema",
boot:"Iniciar sistema",
start:"Inicio",
normal:"NORMAL",
gaming:"MODO GAMING",
gameTime:"Tiempo de juego",
startTimer:"Iniciar",
pause:"Pausar",
reset:"Reiniciar",
gamingTitle:"Modo Gaming",
gamingDescription:"Activa o desactiva el modo Gaming.",
enable:"Activar",
disable:"Desactivar",
visits:"Contador de visitas",
local:"Visitas registradas en este navegador",
settings:"Configuración",
language:"Idioma",
save:"Guardar",
kiwi:"Kiwi",
kiwiDescription:"Centro de enlaces de Kiwi",
emptyKiwi:"Todavía no hay enlaces agregados.",
pages:"Páginas"
},
en:{
languageTitle:"Select your system language",
boot:"Start system",
start:"Start",
normal:"NORMAL",
gaming:"GAMING MODE",
gameTime:"Game Time",
startTimer:"Start",
pause:"Pause",
reset:"Reset",
gamingTitle:"Gaming Mode",
gamingDescription:"Enable or disable Gaming Mode.",
enable:"Enable",
disable:"Disable",
visits:"Visit Counter",
local:"Visits recorded in this browser",
settings:"Settings",
language:"Language",
save:"Save",
kiwi:"Kiwi",
kiwiDescription:"Kiwi links center",
emptyKiwi:"No links added yet.",
pages:"Pages"
},
fr:{
languageTitle:"Sélectionnez la langue du système",
boot:"Démarrer le système",
start:"Accueil",
normal:"NORMAL",
gaming:"MODE GAMING",
gameTime:"Temps de jeu",
startTimer:"Démarrer",
pause:"Pause",
reset:"Réinitialiser",
gamingTitle:"Mode Gaming",
gamingDescription:"Activer ou désactiver le mode Gaming.",
enable:"Activer",
disable:"Désactiver",
visits:"Compteur de visites",
local:"Visites enregistrées dans ce navigateur",
settings:"Paramètres",
language:"Langue",
save:"Enregistrer",
kiwi:"Kiwi",
kiwiDescription:"Centre des liens Kiwi",
emptyKiwi:"Aucun lien ajouté.",
pages:"Pages"
},
ru:{
languageTitle:"Выберите язык системы",
boot:"Запустить систему",
start:"Пуск",
normal:"ОБЫЧНЫЙ",
gaming:"ИГРОВОЙ РЕЖИМ",
gameTime:"Игровое время",
startTimer:"Старт",
pause:"Пауза",
reset:"Сброс",
gamingTitle:"Игровой режим",
gamingDescription:"Включить или выключить игровой режим.",
enable:"Включить",
disable:"Выключить",
visits:"Счётчик посещений",
local:"Посещения в этом браузере",
settings:"Настройки",
language:"Язык",
save:"Сохранить",
kiwi:"Киви",
kiwiDescription:"Центр ссылок Kiwi",
emptyKiwi:"Ссылок пока нет.",
pages:"Страницы"
}
};

let lang=localStorage.getItem("dazLanguage")||"es";

function t(key){
 return translations[lang][key]||key;
}

// INICIO

function bootSystem(){
 lang=document.getElementById("languageSelect").value;
 localStorage.setItem("dazLanguage",lang);
 document.getElementById("languageScreen").classList.add("hidden");
 updateClock();
 registerVisit();
 renderMode();
}

function initialize(){
 if(!translations[lang])lang="es";

 document.getElementById("languageSelect").value=lang;
 document.getElementById("languageTitle").textContent=t("languageTitle");
 document.getElementById("bootButton").textContent=t("boot");
}

function registerVisit(){
 let visits=Number(localStorage.getItem("dazVisits")||0)+1;
 localStorage.setItem("dazVisits",visits);
}

// RELOJ

function updateClock(){
 document.getElementById("clock").textContent=
 new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}
setInterval(updateClock,1000);

// MENÚ

function toggleStart(){
 document.getElementById("startMenu").classList.toggle("open");
}

// VENTANAS

function showWindow(title,content){
 document.getElementById("windowTitle").textContent=title;
 document.getElementById("windowContent").innerHTML=content;
 document.getElementById("window").classList.add("show");
 document.getElementById("startMenu").classList.remove("open");
}

function closeWindow(){
 document.getElementById("window").classList.remove("show");
}

function openPage(name){
 if(pages[name]){
   window.open(pages[name],"_blank","noopener");
 }
}

// KIWI APP

function openKiwi(){
 let html=`
 <h2>🥝 Kiwi</h2>
 <p>${t("kiwiDescription")}</p>
 <div class="grid">
 `;

 if(kiwiLinks.length===0){
   html+=`
   <div class="panel">
     <p>${t("emptyKiwi")}</p>
     <p>DAZ Linux V9</p>
   </div>`;
 }

 kiwiLinks.forEach((item,index)=>{
   const safeName=String(item.name).replace(/[&<>"']/g,"");
   html+=`
   <button onclick="openKiwiLink(${index})">
     ${item.icon||"🌐"} ${safeName}
   </button>`;
 });

 html+="</div>";
 showWindow("🥝 Kiwi",html);
}

function openKiwiLink(index){
 const item=kiwiLinks[index];
 if(!item)return;

 try{
   const url=new URL(item.url);
   if(url.protocol==="https:"||url.protocol==="http:"){
     window.open(url.href,"_blank","noopener");
   }
 }catch(e){}
}

// GAME TIME

let elapsed=0;
let timer=null;
let lastTick=0;

function timeString(value){
 const h=Math.floor(value/3600);
 const m=Math.floor(value%3600/60);
 const s=value%60;

 return [h,m,s].map(x=>String(x).padStart(2,"0")).join(":");
}

function openGameTime(){
 showWindow("Game Time",`
 <div class="panel">
 <h2>⏱️ ${t("gameTime")}</h2>
 <div class="big-time" id="timerDisplay">${timeString(elapsed)}</div>
 <button onclick="startTimer()">${t("startTimer")}</button>
 <button onclick="pauseTimer()">${t("pause")}</button>
 <button onclick="resetTimer()">${t("reset")}</button>
 </div>`);
}

function updateTimer(){
 elapsed+=Math.floor((Date.now()-lastTick)/1000);
 lastTick=Date.now();

 const display=document.getElementById("timerDisplay");
 if(display)display.textContent=timeString(elapsed);
}

function startTimer(){
 if(timer!==null)return;
 lastTick=Date.now();
 timer=setInterval(updateTimer,1000);
}

function pauseTimer(){
 if(timer===null)return;
 updateTimer();
 clearInterval(timer);
 timer=null;
}

function resetTimer(){
 pauseTimer();
 elapsed=0;
 const display=document.getElementById("timerDisplay");
 if(display)display.textContent=timeString(elapsed);
}

// GAMING MODE

let gamingEnabled=false;

function openGaming(){
 showWindow(t("gamingTitle"),`
 <div class="panel">
 <h2>🎮 ${t("gamingTitle")}</h2>
 <p>${t("gamingDescription")}</p>
 <button onclick="toggleGaming()">
 ${gamingEnabled?t("disable"):t("enable")}
 </button>
 <p>${gamingEnabled?t("gaming"):t("normal")}</p>
 </div>`);
}

function toggleGaming(){
 gamingEnabled=!gamingEnabled;
 renderMode();
 openGaming();
}

function renderMode(){
 document.getElementById("modeIndicator").textContent=
 gamingEnabled?t("gaming"):t("normal");
 document.body.style.background=
 gamingEnabled?"#101010":"var(--bg)";
}

// VISITAS

function openVisits(){
 const visits=localStorage.getItem("dazVisits")||0;

 showWindow(t("visits"),`
 <div class="panel">
 <h2>📊 ${t("visits")}</h2>
 <div class="big-time">${visits}</div>
 <p>${t("local")}</p>
 </div>`);
}

// CONFIGURACIÓN

function openSettings(){
 showWindow(t("settings"),`
 <div class="panel">
 <h2>⚙️ ${t("settings")}</h2>
 <p>${t("language")}</p>
 <select id="settingsLanguage">
 <option value="es">Español</option>
 <option value="en">English</option>
 <option value="fr">Français</option>
 <option value="ru">Русский</option>
 </select>
 <button onclick="changeLanguage()">${t("save")}</button>
 </div>`);

 document.getElementById("settingsLanguage").value=lang;
}

function changeLanguage(){
 lang=document.getElementById("settingsLanguage").value;
 localStorage.setItem("dazLanguage",lang);
 closeWindow();
 renderMode();
}

// INICIAR

initialize();

</script>
</body>
</html>
