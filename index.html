
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAZ Linux V9</title>

<style>
:root {
  --bg:#171717;
  --panel:#242424;
  --panel2:#303030;
  --red:#a71920;
  --gold:#c5a45b;
  --text:#eee;
  --muted:#aaa;
}

* {box-sizing:border-box}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button,select {
  font:inherit;
}

button {
  cursor:pointer;
  background:#333;
  color:white;
  border:1px solid #555;
  padding:9px 13px;
}

button:hover {background:var(--red)}

#desktop {
  height:calc(100vh - 42px);
  padding:18px;
  background:
    radial-gradient(ellipse at center,#292929 0%,#151515 80%);
  display:grid;
  grid-template-columns:repeat(auto-fill,90px);
  grid-auto-rows:100px;
  align-content:start;
  gap:8px;
}

.desktop-icon {
  width:85px;
  min-height:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  text-align:center;
  font-size:12px;
  cursor:pointer;
  border:1px solid transparent;
  padding:5px;
  border-radius:5px;
  user-select:none;
}

.desktop-icon:hover {
  background:#ffffff18;
  border-color:#777;
}

.desktop-icon .symbol {
  font-size:30px;
}

.desktop-icon span:last-child {
  overflow-wrap:anywhere;
}

#taskbar {
  position:fixed;
  bottom:0;
  height:42px;
  width:100%;
  background:#202020;
  border-top:2px solid var(--red);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8px;
  z-index:20;
}

#startButton {
  background:var(--red);
  border:1px solid var(--gold);
  font-weight:bold;
}

#taskLeft,#taskRight {
  display:flex;
  align-items:center;
  gap:10px;
}

#clock {
  font-size:13px;
  color:var(--gold);
}

#startMenu {
  position:fixed;
  bottom:46px;
  left:8px;
  width:min(280px,90vw);
  background:#222;
  border:1px solid var(--gold);
  border-top:3px solid var(--red);
  padding:12px;
  z-index:30;
  display:none;
  box-shadow:0 5px 20px #0009;
}

#startMenu.open {display:block}

.menu-title {
  font-weight:bold;
  padding:10px;
  border-bottom:1px solid #555;
  color:var(--gold);
}

.menu-item {
  width:100%;
  text-align:left;
  margin-top:5px;
  background:#303030;
}

#window {
  display:none;
  position:fixed;
  z-index:10;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(750px,94vw);
  height:min(540px,78vh);
  background:#222;
  border:1px solid var(--gold);
  box-shadow:0 10px 35px #000b;
}

#window.show {display:flex;flex-direction:column}

#windowHeader {
  height:42px;
  background:var(--red);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  font-weight:bold;
}

#windowContent {
  padding:20px;
  overflow:auto;
  flex:1;
}

#windowContent iframe {
  width:100%;
  height:100%;
  min-height:350px;
  border:0;
  background:white;
}

.window-close {
  background:#222;
  padding:4px 10px;
}

.panel {
  background:#303030;
  padding:16px;
  margin-bottom:14px;
  border-left:3px solid var(--red);
}

.big-time {
  text-align:center;
  font-size:38px;
  color:var(--gold);
  margin:20px;
}

.shortcut-list {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.shortcut-list button {
  text-align:left;
}

#languageScreen {
  position:fixed;
  inset:0;
  background:#111;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.language-box {
  background:#242424;
  border:1px solid var(--gold);
  border-top:5px solid var(--red);
  padding:30px;
  width:min(400px,100%);
  text-align:center;
}

.language-box select {
  width:100%;
  margin:15px 0;
  padding:12px;
}

.language-box button {width:100%}

.hidden {display:none!important}

footer {
  color:var(--muted);
  font-size:11px;
  text-align:center;
  padding:8px;
}

@media(max-width:500px) {
  #desktop {
    grid-template-columns:repeat(3,1fr);
    padding:10px;
  }

  .desktop-icon {width:100%}
}
</style>
</head>

<body>

<!-- LANGUAGE STARTUP -->
<div id="languageScreen">
  <div class="language-box">
    <h1>☭ DAZ LINUX V9</h1>
    <p id="languageTitle">Selecciona el idioma del sistema</p>

    <select id="languageSelect">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="ru">Русский</option>
    </select>

    <button onclick="bootSystem()" id="bootButton">
      Iniciar sistema
    </button>
    <footer>DAZ OPERATING SYSTEM</footer>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop">

  <div class="desktop-icon" onclick="openPage('StudySync')">
    <span class="symbol">📚</span>
    <span>StudySync</span>
  </div>

  <div class="desktop-icon" onclick="openPage('Classwork Cloud')">
    <span class="symbol">☁️</span>
    <span>Classwork Cloud</span>
  </div>

  <div class="desktop-icon" onclick="openPage('Kiwi')">
    <span class="symbol">🥝</span>
    <span>Kiwi</span>
  </div>

  <div class="desktop-icon" onclick="openPage('Classwork US')">
    <span class="symbol">📖</span>
    <span>Classwork US</span>
  </div>

  <div class="desktop-icon" onclick="openPage('Learning')">
    <span class="symbol">🎓</span>
    <span>Learning</span>
  </div>

  <div class="desktop-icon" onclick="openPage('Biology')">
    <span class="symbol">🧬</span>
    <span>Biology</span>
  </div>

  <div class="desktop-icon" onclick="openPage('Nettle Web')">
    <span class="symbol">🌐</span>
    <span>Nettle Web</span>
  </div>

  <div class="desktop-icon" onclick="openTool('gametime')">
    <span class="symbol">⏱️</span>
    <span>Game Time</span>
  </div>

  <div class="desktop-icon" onclick="openTool('gaming')">
    <span class="symbol">🎮</span>
    <span>Gaming Mode</span>
  </div>

  <div class="desktop-icon" onclick="openTool('visits')">
    <span class="symbol">📊</span>
    <span>Visit Counter</span>
  </div>

</div>

<!-- START MENU -->
<div id="startMenu">
  <div class="menu-title">☭ DAZ LINUX V9</div>

  <button class="menu-item" onclick="openTool('gametime')">
    ⏱️ Game Time
  </button>

  <button class="menu-item" onclick="openTool('gaming')">
    🎮 Gaming Mode
  </button>

  <button class="menu-item" onclick="openTool('visits')">
    📊 Visit Counter
  </button>

  <button class="menu-item" onclick="openTool('pages')">
    🌐 Páginas instaladas
  </button>

  <button class="menu-item" onclick="openTool('settings')">
    ⚙️ Settings
  </button>
</div>

<!-- WINDOW -->
<div id="window">
  <div id="windowHeader">
    <span id="windowTitle">DAZ Linux</span>
    <button class="window-close" onclick="closeWindow()">✕</button>
  </div>
  <div id="windowContent"></div>
</div>

<!-- TASKBAR -->
<div id="taskbar">
  <div id="taskLeft">
    <button id="startButton" onclick="toggleStart()">
      ☭ START
    </button>
    <span>DAZ Linux V9</span>
  </div>

  <div id="taskRight">
    <span id="modeIndicator">● NORMAL</span>
    <span id="clock">00:00</span>
  </div>
</div>

<script>

// PAGES: ONLY USER-PROVIDED WEBSITES

const pages = {
  "StudySync":"https://studysync.co.uk/",
  "Classwork Cloud":"https://classwork.cloud/",
  "Kiwi":"https://kiwi.at.it/",
  "Classwork US":"https://classwork.us.com/",
  "Learning":"https://learning.com.de/",
  "Biology":"https://biology.us.com/",
  "Nettle Web":"https://nettleweb.pages.dev/"
};

// TRANSLATIONS

const translations = {
es:{
languageTitle:"Selecciona el idioma del sistema",
boot:"Iniciar sistema",
start:"Inicio",
normal:"NORMAL",
gaming:"MODO GAMING",
pages:"Páginas instaladas",
settings:"Configuración",
gameTime:"Tiempo de juego",
startTimer:"Iniciar",
pause:"Pausar",
reset:"Reiniciar",
gamingTitle:"Gaming Mode",
gamingDescription:"Activa o desactiva el modo Gaming.",
enable:"Activar",
disable:"Desactivar",
visits:"Contador de visitas",
local:"Visitas registradas en este navegador",
language:"Idioma",
save:"Guardar",
openPage:"Abrir página",
system:"Sistema"
},
en:{
languageTitle:"Select your system language",
boot:"Start system",
start:"Start",
normal:"NORMAL",
gaming:"GAMING MODE",
pages:"Installed pages",
settings:"Settings",
gameTime:"Game Time",
startTimer:"Start",
pause:"Pause",
reset:"Reset",
gamingTitle:"Gaming Mode",
gamingDescription:"Enable or disable Gaming Mode.",
enable:"Enable",
disable:"Disable",
visits:"Visit Counter",
local:"Visits recorded in this browser",
language:"Language",
save:"Save",
openPage:"Open page",
system:"System"
},
fr:{
languageTitle:"Sélectionnez la langue du système",
boot:"Démarrer le système",
start:"Accueil",
normal:"NORMAL",
gaming:"MODE GAMING",
pages:"Pages installées",
settings:"Paramètres",
gameTime:"Temps de jeu",
startTimer:"Démarrer",
pause:"Pause",
reset:"Réinitialiser",
gamingTitle:"Mode Gaming",
gamingDescription:"Activer ou désactiver le mode Gaming.",
enable:"Activer",
disable:"Désactiver",
visits:"Compteur de visites",
local:"Visites enregistrées dans ce navigateur",
language:"Langue",
save:"Enregistrer",
openPage:"Ouvrir la page",
system:"Système"
},
ru:{
languageTitle:"Выберите язык системы",
boot:"Запустить систему",
start:"Пуск",
normal:"ОБЫЧНЫЙ",
gaming:"ИГРОВОЙ РЕЖИМ",
pages:"Установленные страницы",
settings:"Настройки",
gameTime:"Игровое время",
startTimer:"Старт",
pause:"Пауза",
reset:"Сброс",
gamingTitle:"Игровой режим",
gamingDescription:"Включить или выключить игровой режим.",
enable:"Включить",
disable:"Выключить",
visits:"Счётчик посещений",
local:"Посещения в этом браузере",
language:"Язык",
save:"Сохранить",
openPage:"Открыть страницу",
system:"Система"
}
};

let lang="es";

function t(key){
  return translations[lang][key] || key;
}

// STORAGE: INDEXEDDB + LOCALSTORAGE

let db;

function initDB(){
  return new Promise((resolve)=>{
    if(!window.indexedDB){
      resolve(null);
      return;
    }

    const request=indexedDB.open("DAZLinuxV9",1);

    request.onupgradeneeded=()=>{
      const database=request.result;
      if(!database.objectStoreNames.contains("settings")){
        database.createObjectStore("settings");
      }
    };

    request.onsuccess=()=>{
      db=request.result;
      resolve(db);
    };

    request.onerror=()=>resolve(null);
  });
}

function saveDB(key,value){
  try{
    if(db){
      const tx=db.transaction("settings","readwrite");
      tx.objectStore("settings").put(value,key);
    }
  }catch(e){}
}

function getDB(key){
  return new Promise(resolve=>{
    if(!db){
      resolve(null);
      return;
    }

    try{
      const request=db.transaction("settings")
        .objectStore("settings").get(key);

      request.onsuccess=()=>resolve(request.result ?? null);
      request.onerror=()=>resolve(null);
    }catch(e){
      resolve(null);
    }
  });
}

// BOOT SYSTEM

async function bootSystem(){
  lang=document.getElementById("languageSelect").value;

  localStorage.setItem("dazLanguage",lang);
  saveDB("language",lang);

  document.getElementById("languageScreen").classList.add("hidden");
  updateClock();
  await registerVisit();
  renderMode();

  localStorage.setItem("dazBooted","true");
}

async function initialize(){
  await initDB();

  let saved=localStorage.getItem("dazLanguage");
  if(!saved) saved=await getDB("language");

  if(["es","en","fr","ru"].includes(saved)){
    document.getElementById("languageSelect").value=saved;
    lang=saved;
  }

  document.getElementById("languageTitle").textContent=t("languageTitle");
  document.getElementById("bootButton").textContent=t("boot");

  document.getElementById("languageScreen").classList.remove("hidden");
}

// CLOCK

function updateClock(){
  const now=new Date();

  document.getElementById("clock").textContent=
    now.toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit"
    });
}

setInterval(updateClock,1000);

// START MENU

function toggleStart(){
  document.getElementById("startMenu").classList.toggle("open");
}

// WINDOWS

function showWindow(title,content){
  document.getElementById("windowTitle").textContent=title;
  document.getElementById("windowContent").innerHTML=content;
  document.getElementById("window").classList.add("show");
  document.getElementById("startMenu").classList.remove("open");
}

function closeWindow(){
  document.getElementById("window").classList.remove("show");
}

function openPage(name){
  const url=pages[name];
  if(!url)return;

  // Open in a new browser tab to avoid sites blocking iframes.
  window.open(url,"_blank","noopener");
}

// PAGE LIST

function openTool(tool){
  if(tool==="pages"){
    let html="<h2>"+t("pages")+"</h2><div class='shortcut-list'>";

    Object.entries(pages).forEach(([name,url])=>{
      html+=`<button onclick="window.open('${url}','_blank','noopener')">
      🌐 ${name}</button>`;
    });

    html+="</div>";
    showWindow(t("pages"),html);
  }

  if(tool==="gametime")openGameTime();
  if(tool==="gaming")openGaming();
  if(tool==="visits")openVisits();
  if(tool==="settings")openSettings();
}

// GAME TIME

let elapsed=0;
let timer=null;
let lastTick=0;

function timeString(value){
  const h=Math.floor(value/3600);
  const m=Math.floor(value%3600/60);
  const s=value%60;

  return [h,m,s].map(x=>String(x).padStart(2,"0")).join(":");
}

function openGameTime(){
  showWindow("Game Time",`
    <div class="panel">
      <h2>${t("gameTime")}</h2>
      <div class="big-time" id="timerDisplay">${timeString(elapsed)}</div>
      <button onclick="startTimer()">${t("startTimer")}</button>
      <button onclick="pauseTimer()">${t("pause")}</button>
      <button onclick="resetTimer()">${t("reset")}</button>
    </div>
  `);
}

function updateTimer(){
  elapsed+=Math.floor((Date.now()-lastTick)/1000);
  lastTick=Date.now();

  const display=document.getElementById("timerDisplay");
  if(display)display.textContent=timeString(elapsed);
}

function startTimer(){
  if(timer!==null)return;
  lastTick=Date.now();

  timer=setInterval(updateTimer,1000);
}

function pauseTimer(){
  if(timer===null)return;
  updateTimer();
  clearInterval(timer);
  timer=null;
}

function resetTimer(){
  pauseTimer();
  elapsed=0;

  const display=document.getElementById("timerDisplay");
  if(display)display.textContent=timeString(elapsed);
}

// GAMING MODE

let gamingEnabled=false;

function openGaming(){
  showWindow(t("gamingTitle"),`
    <div class="panel">
      <h2>${t("gamingTitle")}</h2>
      <p>${t("gamingDescription")}</p>
      <button onclick="toggleGaming()">
        ${gamingEnabled?t("disable"):t("enable")}
      </button>
      <p id="gamingText">${gamingEnabled?t("gaming"):t("normal")}</p>
    </div>
  `);
}

function toggleGaming(){
  gamingEnabled=!gamingEnabled;
  renderMode();
  openGaming();
}

function renderMode(){
  document.body.style.setProperty(
    "--bg",gamingEnabled?"#101010":"#171717"
  );

  document.getElementById("modeIndicator").textContent=
    gamingEnabled?"● "+t("gaming"):"● "+t("normal");
}

// VISIT COUNTER

async function registerVisit(){
  let visits=Number(localStorage.getItem("dazVisits")||0);
  visits++;

  localStorage.setItem("dazVisits",visits);
  saveDB("visits",visits);
}

function openVisits(){
  const visits=localStorage.getItem("dazVisits")||0;

  showWindow(t("visits"),`
    <div class="panel">
      <h2>${t("visits")}</h2>
      <div class="big-time">${visits}</div>
      <p>${t("local")}</p>
    </div>
  `);
}

// SETTINGS

function openSettings(){
  showWindow(t("settings"),`
    <div class="panel">
      <h2>${t("settings")}</h2>
      <p>${t("language")}</p>
      <select id="settingsLanguage">
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="ru">Русский</option>
      </select>
      <button onclick="changeSystemLanguage()">${t("save")}</button>
    </div>
  `);

  document.getElementById("settingsLanguage").value=lang;
}

function changeSystemLanguage(){
  const value=document.getElementById("settingsLanguage").value;

  if(!translations[value])return;

  lang=value;
  localStorage.setItem("dazLanguage",lang);
  saveDB("language",lang);

  document.getElementById("languageTitle").textContent=t("languageTitle");
  document.getElementById("bootButton").textContent=t("boot");

  renderMode();
  closeWindow();
}

// START

initialize();

</script>
</body>
</html>
