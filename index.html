
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAZ Linux V10</title>
<style>
:root {
  --red:#a71919;
  --red2:#d52b2b;
  --gold:#e0b94f;
  --bg:#171717;
  --panel:#242424;
  --panel2:#303030;
  --text:#f2f2f2;
  --muted:#aaa;
  --wallpaper:linear-gradient(135deg,#171717,#351010,#111);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;overflow:hidden
}
button,input,select,textarea{font:inherit}
button{
  background:var(--red);color:white;border:1px solid #ffffff22;
  padding:9px 13px;border-radius:5px;cursor:pointer
}
button:hover{background:var(--red2)}
input,select,textarea{
  background:#151515;color:white;border:1px solid #555;
  padding:10px;border-radius:5px;width:100%
}
textarea{resize:vertical;min-height:130px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
h2,h3{margin-top:0}
a{color:var(--gold)}
#boot{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#481515,#111 70%)
}
.boot-card{
  width:min(440px,92vw);background:#191919;
  border:1px solid var(--gold);border-top:5px solid var(--red);
  padding:28px;border-radius:10px;text-align:center;
  box-shadow:0 15px 60px #0009
}
.logo{font-size:38px;font-weight:bold;color:var(--gold);letter-spacing:3px}
.star{font-size:25px;color:var(--red2)}
.boot-card>*{margin-bottom:15px}
#desktop{
  position:fixed;inset:0 0 44px 0;
  background:var(--wallpaper);background-size:cover
}
#desktop::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,#0003,transparent 60%)
}
.desktop-title{
  position:absolute;right:25px;top:22px;text-align:right;
  color:#ffffffaa;pointer-events:none
}
.desktop-title strong{color:var(--gold);font-size:25px}
#icons{
  position:absolute;top:18px;left:15px;bottom:15px;
  display:flex;flex-direction:column;flex-wrap:wrap;
  align-content:flex-start;gap:12px;z-index:1
}
.desktop-icon{
  width:85px;min-height:75px;text-align:center;padding:8px 3px;
  cursor:pointer;border:1px solid transparent;border-radius:6px;
  font-size:12px;text-shadow:1px 1px 3px #000
}
.desktop-icon:hover{background:#ffffff20;border-color:#ffffff30}
.desktop-icon .emoji{font-size:29px;display:block;margin-bottom:5px}
#taskbar{
  position:fixed;bottom:0;left:0;right:0;height:44px;
  display:flex;align-items:center;gap:8px;padding:5px 9px;
  background:#151515;border-top:2px solid var(--red);z-index:900
}
#start-button{font-weight:bold;color:var(--gold);height:33px}
#task-items{display:flex;gap:5px;flex:1;overflow:auto}
.task-item{background:#333;white-space:nowrap;padding:7px 12px}
#clock{font-size:13px;min-width:125px;text-align:center}
#start-menu{
  position:fixed;bottom:44px;left:8px;width:260px;
  background:#1c1c1c;border:1px solid var(--gold);
  border-top:4px solid var(--red);padding:12px;z-index:950;
  box-shadow:0 10px 35px #0009;border-radius:7px
}
.start-entry{
  display:block;width:100%;text-align:left;background:transparent;
  border:0;padding:11px;border-radius:4px
}
.start-entry:hover{background:#ffffff18}
#notification-panel{
  position:fixed;right:8px;bottom:50px;width:300px;
  max-height:75vh;overflow:auto;background:#1c1c1c;
  border:1px solid var(--gold);padding:15px;z-index:950;
  border-radius:8px
}
.window{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(700px,94vw);height:min(520px,82vh);
  min-width:280px;min-height:220px;background:var(--panel);
  border:1px solid #777;border-top:4px solid var(--red);
  box-shadow:0 15px 45px #000a;border-radius:7px;
  display:flex;flex-direction:column;overflow:hidden
}
.window.maximized{
  left:0!important;top:0!important;transform:none!important;
  width:100%!important;height:calc(100% - 0px)!important;
  border-radius:0
}
.window-header{
  background:#171717;padding:9px 10px;display:flex;
  align-items:center;justify-content:space-between;
  cursor:move;user-select:none;min-height:39px
}
.window-title{font-weight:bold;color:var(--gold)}
.window-controls{display:flex;gap:5px}
.window-controls button{padding:3px 9px;background:#333}
.window-controls .close{background:#941d1d}
.window-content{padding:15px;overflow:auto;flex:1}
.panel{
  background:var(--panel2);border:1px solid #ffffff14;
  padding:12px;border-radius:6px;margin-bottom:10px
}
.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:10px
}
.tile{
  background:#303030;border:1px solid #ffffff20;
  border-radius:6px;padding:13px;cursor:pointer
}
.tile:hover{border-color:var(--gold);background:#3b3030}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.link-item{
  display:flex;gap:8px;align-items:center;
  padding:10px;background:#303030;margin:7px 0;border-radius:5px
}
.link-item .link-info{flex:1;min-width:0}
.link-item a{overflow-wrap:anywhere}
.terminal{
  background:#080d08;color:#76dc76;font-family:monospace;
  padding:13px;min-height:250px;border-radius:5px;
  white-space:pre-wrap;overflow:auto
}
.terminal-input{display:flex;margin-top:8px;gap:7px}
.terminal-input input{font-family:monospace}
.file-row{
  display:flex;align-items:center;gap:10px;
  padding:9px;border-bottom:1px solid #ffffff16
}
.file-row button{padding:5px 8px}
.note-area{min-height:250px}
.stat{font-size:25px;color:var(--gold);font-weight:bold}
#toast{
  position:fixed;bottom:58px;left:50%;transform:translateX(-50%);
  background:#222;border:1px solid var(--gold);padding:10px 18px;
  border-radius:7px;z-index:2000;display:none
}
footer{font-size:11px;color:#999;text-align:center;margin-top:15px}
@media(max-width:600px){
  #icons{gap:5px}
  .desktop-icon{width:70px;font-size:10px}
  .desktop-icon .emoji{font-size:24px}
  #clock{min-width:85px;font-size:11px}
  .window{width:96vw;height:82vh}
}
</style>
</head>

<div id="boot">
  <div class="boot-card">
    <div class="star">★ ★ ★</div>
    <div class="logo">DAZ LINUX</div>
    <h3>V10 — People's Desktop</h3>
    <p id="welcomeText">Bienvenido al escritorio DAZ Linux</p>
    <label id="languageLabel">Selecciona tu idioma</label>
    <select id="languageSelect">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="ru">Русский</option>
    </select>
    <input id="username" maxlength="24" placeholder="Nombre de usuario">
    <button id="loginButton" onclick="login()" style="width:100%">Iniciar sesión</button>
    <p class="small muted">DAZ Linux V10 · Community Edition</p>
  </div>
</div>

<div id="desktop" class="hidden">
  <div id="icons"></div>
  <div class="desktop-title">
    <strong>DAZ LINUX V10</strong><br>
    <span id="desktopSubtitle">Sistema de escritorio comunitario</span>
  </div>
</div>

<div id="taskbar" class="hidden">
  <button id="start-button" onclick="toggleStart()">★ DAZ</button>
  <div id="task-items"></div>
  <button onclick="toggleNotifications()" title="Notificaciones">🔔</button>
  <div id="clock"></div>
</div>

<div id="start-menu" class="hidden">
  <h3 style="color:var(--gold)">★ DAZ Linux V10</h3>
  <div id="startEntries"></div>
  <hr>
  <button class="start-entry" onclick="logout()">↪ <span data-t="logout">Cerrar sesión</span></button>
</div>

<div id="notification-panel" class="hidden">
  <h3 data-t="notifications">Notificaciones</h3>
  <div class="panel">
    <div class="stat" id="panelClock">--:--</div>
    <div id="panelDate"></div>
  </div>
  <div class="panel">
    <h3 data-t="calendar">Calendario</h3>
    <div id="calendar"></div>
  </div>
  <button onclick="toast(T().noNotifications)">✓ <span data-t="clearNotifications">Limpiar notificaciones</span></button>
</div>

<div id="toast"></div>

let lang="es",username="Guest",zIndex=10,windowCount=0;
let favorites=JSON.parse(localStorage.getItem("dazFavs")||"[]");
let links=JSON.parse(localStorage.getItem("dazLinks")||"null")||[
 {name:"StudySync",url:"https://studysync.co.uk/",category:"study"},

 {id:1,name:"Documents",type:"folder",parent:0},
 {id:2,name:"Pictures",type:"folder",parent:0},
 {id:3,name:"Welcome.txt",type:"file",parent:0,content:"Welcome to DAZ Linux V10!"},
 {id:4,name:"Readme.txt",type:"file",parent:0,content:"DAZ Linux V10 Community Edition"}
];
let nextFileId=Math.max(0,...files.map(f=>f.id))+1;
let currentFolder=0;
let recycle=JSON.parse(localStorage.getItem("dazRecycle")||"[]");
let openWindows={};
let visitCount=Number(localStorage.getItem("dazVisits")||0)+1;
localStorage.setItem("dazVisits",visitCount);

let toastTimer;

function T(){return translations[lang]||translations.es}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function saveAll(){
 localStorage.setItem("dazFavs",JSON.stringify(favorites));
 localStorage.setItem("dazLinks",JSON.stringify(links));
 localStorage.setItem("dazFiles",JSON.stringify(files));
 localStorage.setItem("dazRecycle",JSON.stringify(recycle));
}
function toast(msg){
 const el=document.getElementById("toast");
 el.textContent=msg;el.style.display="block";
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display="none",2600);
}
function login(){
 lang=document.getElementById("languageSelect").value;
 username=document.getElementById("username").value.trim()||"Guest";
 localStorage.setItem("dazLanguage",lang);
 localStorage.setItem("dazUsername",username);
 document.getElementById("boot").classList.add("hidden");
 document.getElementById("desktop").classList.remove("hidden");
 document.getElementById("taskbar").classList.remove("hidden");
 applyTheme();buildDesktop();buildStart();translatePage();
 toast(T().welcomeMessage);
}
function logout(){
 document.getElementById("boot").classList.remove("hidden");
 document.getElementById("desktop").classList.add("hidden");
 document.getElementById("taskbar").classList.add("hidden");
 closeAllWindows();
 toggleStart(false);
}
function translatePage(){
 document.querySelectorAll("[data-t]").forEach(el=>{
  const key=el.dataset.t;if(T()[key])el.textContent=T()[key];
 });
 document.getElementById("welcomeText").textContent=T().welcome;
 document.getElementById("languageLabel").textContent=T().language;
 document.getElementById("loginButton").textContent=T().login;
 document.getElementById("username").placeholder=T().username;
 document.getElementById("desktopSubtitle").textContent=T().subtitle;
}
const apps=[
 {id:"kiwi",icon:"🥝",name:"Kiwi Center",fn:openKiwi},
 {id:"control",icon:"⚙️",name:"DAZ Control Center",fn:openControl},
 {id:"files",icon:"📁",name:"DAZ Files",fn:openFiles},
 {id:"terminal",icon:"⌨️",name:"DAZ Terminal",fn:openTerminal},
 {id:"notifications",icon:"🔔",name:"Notification Center",fn:toggleNotifications},
 {id:"software",icon:"🧰",name:"DAZ Software Center",fn:openSoftware},
 {id:"notes",icon:"📝",name:"Notepad",fn:openNotes},
 {id:"calculator",icon:"🧮",name:"Calculator",fn:openCalculator},
 {id:"visits",icon:"📊",name:"Visit Counter",fn:openVisits},
 {id:"about",icon:"★",name:"About DAZ Linux",fn:openAbout}
];
function buildDesktop(){
 const el=document.getElementById("icons");el.innerHTML="";
 apps.forEach(a=>{
  const div=document.createElement("div");div.className="desktop-icon";
  div.innerHTML=`<span class="emoji">${a.icon}</span>${esc(a.name)}`;
  div.ondblclick=a.fn;div.onclick=()=>{};
  el.appendChild(div);
 });
}
function buildStart(){
 const el=document.getElementById("startEntries");el.innerHTML="";
 apps.forEach(a=>{
  const b=document.createElement("button");b.className="start-entry";

 });

function toggleStart(force){
 const el=document.getElementById("start-menu");
 if(force===false)el.classList.add("hidden");
 else el.classList.toggle("hidden");
 document.getElementById("notification-panel").classList.add("hidden");
}
function toggleNotifications(){
 document.getElementById("notification-panel").classList.toggle("hidden");

}
function updateCalendar(){
 const now=new Date();
 document.getElementById("panelClock").textContent=now.toLocaleTimeString();
 document.getElementById("panelDate").textContent=now.toLocaleDateString(lang);
 const first=new Date(now.getFullYear(),now.getMonth(),1);
 const days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
 let html=`<strong>${now.toLocaleString(lang,{month:"long",year:"numeric"})}</strong><div class="grid" style="grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px">`;
 for(let i=0;i<first.getDay();i++)html+="<span></span>";
 for(let d=1;d<=days;d++)html+=`<span style="padding:5px;text-align:center;background:${d===now.getDate()?"var(--red)":"#333"}">${d}</span>`;
 document.getElementById("calendar").innerHTML=html+"</div>";
}
function updateClock(){
 const now=new Date();
 document.getElementById("clock").textContent=now.toLocaleDateString(lang,{day:"2-digit",month:"short"})+" · "+now.toLocaleTimeString(lang,{hour:"2-digit",minute:"2-digit"});
 if(!document.getElementById("notification-panel").classList.contains("hidden"))updateCalendar();
}
setInterval(updateClock,1000);
function applyTheme(){
 const colors={red:"#a71919",dark:"#555",gold:"#92721d",blue:"#205d91",green:"#277044"};
 document.documentElement.style.setProperty("--red",colors[theme]||colors.red);
 const walls={
 default:"linear-gradient(135deg,#171717,#351010,#111)",
 red:"linear-gradient(135deg,#290909,#8d1717,#170707)",
 black:"linear-gradient(135deg,#050505,#252525,#090909)",
 gold:"linear-gradient(135deg,#18130a,#554016,#090909)",
 stars:"radial-gradient(circle at 20% 30%,#555 1px,transparent 2px),radial-gradient(circle at 70% 60%,#777 1px,transparent 2px),linear-gradient(130deg,#090909,#301010)"
 };
 document.documentElement.style.setProperty("--wallpaper",walls[wallpaper]||walls.default);
}
function createWindow(id,title,content){
 if(openWindows[id]){
  const old=document.getElementById(openWindows[id]);
  if(old){old.classList.remove("hidden");old.style.zIndex=++zIndex;return old}
 }
 const wid="win"+(++windowCount);
 const win=document.createElement("div");
 win.className="window";win.id=wid;win.style.zIndex=++zIndex;
 win.innerHTML=`
 <div class="window-header">
  <span class="window-title">${esc(title)}</span>
  <div class="window-controls">
   <button onclick="minimizeWindow('${wid}')">—</button>
   <button onclick="maximizeWindow('${wid}')">□</button>
   <button class="close" onclick="closeWindow('${id}')">×</button>
  </div>
 </div>
 <div class="window-content">${content}</div>`;
 document.getElementById("desktop").appendChild(win);
 openWindows[id]=wid;makeDraggable(win);
 win.addEventListener("mousedown",()=>win.style.zIndex=++zIndex);
 renderTaskItems();
 return win;
}
function makeDraggable(win){
 const bar=win.querySelector(".window-header");let sx=0,sy=0,ox=0,oy=0,moving=false;
 bar.addEventListener("mousedown",e=>{
  if(e.target.tagName==="BUTTON"||win.classList.contains("maximized"))return;
  moving=true;sx=e.clientX;sy=e.clientY;
  const r=win.getBoundingClientRect();ox=r.left;oy=r.top;
  win.style.transform="none";win.style.left=ox+"px";win.style.top=oy+"px";
 });
 document.addEventListener("mousemove",e=>{
  if(!moving)return;
  win.style.left=Math.max(0,ox+e.clientX-sx)+"px";
  win.style.top=Math.max(0,oy+e.clientY-sy)+"px";
 });
 document.addEventListener("mouseup",()=>moving=false);
}
function minimizeWindow(wid){
 const el=document.getElementById(wid);if(el)el.classList.add("hidden");
 renderTaskItems();
}
function maximizeWindow(wid){
 const el=document.getElementById(wid);if(el)el.classList.toggle("maximized");
}
function closeWindow(id){
 const wid=openWindows[id];if(wid)document.getElementById(wid)?.remove();
 delete openWindows[id];renderTaskItems();
}
function closeAllWindows(){
 Object.keys(openWindows).forEach(closeWindow);
}
function renderTaskItems(){
 const el=document.getElementById("task-items");el.innerHTML="";
 Object.entries(openWindows).forEach(([id,wid])=>{
  const win=document.getElementById(wid);if(!win)return;
  const b=document.createElement("button");b.className="task-item";
  b.textContent=win.querySelector(".window-title").textContent;
  b.onclick=()=>{win.classList.remove("hidden");win.style.zIndex=++zIndex};
  el.appendChild(b);
 });
}

function openKiwi(){
 const w=appWindow("kiwi",T().kiwi,`
 <h2>🥝 Kiwi Center</h2>
 <div class="row">
 <input id="kiwiSearch" placeholder="${T().search}..." oninput="renderKiwi()">
 <select id="kiwiFilter" onchange="renderKiwi()">
 <option value="all">${T().all}</option>
 <option value="study">${T().categoryStudy}</option>
 <option value="other">${T().categoryOther}</option>
 <option value="fav">${T().favorites}</option>
 </select></div>
 <div id="kiwiList"></div>
 <div class="panel"><h3>${T().newLink}</h3>
 <input id="newLinkName" placeholder="${T().name}">
 <input id="newLinkUrl" placeholder="https://example.com">

}
function renderKiwi(){
 const list=document.getElementById("kiwiList");if(!list)return;
 const q=(document.getElementById("kiwiSearch")?.value||"").toLowerCase();
 const filter=document.getElementById("kiwiFilter")?.value||"all";
 const selected=links.filter(l=>
  (filter==="all"||l.category===filter||(filter==="fav"&&favorites.includes(l.url)))&&
  (l.name.toLowerCase().includes(q)||l.url.toLowerCase().includes(q)));
 list.innerHTML=selected.length?"":"<p class='muted'>"+T().noResults+"</p>";
 selected.forEach(l=>{
  const div=document.createElement("div");div.className="link-item";
  const info=document.createElement("div");info.className="link-info";
  info.innerHTML=`<strong>${esc(l.name)}</strong><br><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a><br><span class="small muted">${l.category==="study"?T().categoryStudy:T().categoryOther}</span>`;
  const fav=document.createElement("button");fav.textContent=favorites.includes(l.url)?"★":"☆";
  fav.title=T().favorites;fav.onclick=()=>toggleFavorite(l.url);
  const open=document.createElement("button");open.textContent=T().open;
  open.onclick=()=>window.open(l.url,"_blank","noopener");
  const del=document.createElement("button");del.textContent="×";
  del.onclick=()=>{if(confirm(T().confirmDelete)){links=links.filter(x=>x!==l);saveAll();renderKiwi()}};
  div.append(info,fav,open,del);list.appendChild(div);
 });
}
function toggleFavorite(url){
 favorites=favorites.includes(url)?favorites.filter(x=>x!==url):[...favorites,url];
 saveAll();renderKiwi();
}
function addLink(){
 const name=document.getElementById("newLinkName").value.trim();
 let url=document.getElementById("newLinkUrl").value.trim();
 const category=document.getElementById("newLinkCategory").value;
 if(!name||!url){toast(T().name+" / "+T().url);return}
 if(!/^https?:\/\//i.test(url))url="https://"+url;
 try{const parsed=new URL(url);if(!["http:","https:"].includes(parsed.protocol))throw 0}catch(e){toast("Invalid URL");return}
 if(links.some(l=>l.url===url)){toast(T().linkExists);return}
 links.push({name,url,category});saveAll();
 document.getElementById("newLinkName").value="";
 document.getElementById("newLinkUrl").value="";
 renderKiwi();toast(T().created);
}
function openFiles(){

function renderFiles(){
 const items=files.filter(f=>f.parent===currentFolder);
 const folderName=currentFolder===0?"DAZ Files":files.find(f=>f.id===currentFolder)?.name||"DAZ Files";
 const html=`
 <h2>📁 ${esc(folderName)}</h2>
 <div class="row">
 <button onclick="createFolder()">${T().createFolder}</button>
 <button onclick="createFile()">${T().createFile}</button>
 <button onclick="openRecycle()">${T().recycle}</button>
 ${currentFolder!==0?`<button onclick="currentFolder=0;renderFiles()">${T().back}</button>`:""}
 </div><div id="fileList"></div>`;
 const w=appWindow("files",T().files,html);
 const list=w.querySelector("#fileList");
 if(!items.length)list.innerHTML=`<p class="muted">${T().empty}</p>`;
 items.forEach(f=>{
  const row=document.createElement("div");row.className="file-row";
  const name=document.createElement("span");name.style.flex="1";
  name.textContent=(f.type==="folder"?"📁 ":"📄 ")+f.name;
  name.ondblclick=()=>f.type==="folder"?(currentFolder=f.id,renderFiles()):editFile(f.id);
  const open=document.createElement("button");open.textContent=T().open;
  open.onclick=()=>f.type==="folder"?(currentFolder=f.id,renderFiles()):editFile(f.id);
  const del=document.createElement("button");del.textContent="×";
  del.onclick=()=>deleteFile(f.id);
  row.append(name,open,del);list.appendChild(row);
 });
}
function createFolder(){
 const name=prompt(T().folderName);if(!name)return;
 files.push({id:nextFileId++,name,type:"folder",parent:currentFolder});
 saveAll();renderFiles();toast(T().created);
}
function createFile(){
 const name=prompt(T().fileName);if(!name)return;
 files.push({id:nextFileId++,name,type:"file",parent:currentFolder,content:""});
 saveAll();renderFiles();toast(T().created);
}
function editFile(id){
 const f=files.find(x=>x.id===id);if(!f)return;
 const w=appWindow("fileedit"+id,f.name,`
 <h3>📄 ${esc(f.name)}</h3>
 <textarea id="fileContent" class="note-area">${esc(f.content||"")}</textarea>
 <button onclick="saveFile(${id})">${T().save}</button>`);
}
function saveFile(id){
 const f=files.find(x=>x.id===id);if(!f)return;
 f.content=document.getElementById("win"+Object.keys(openWindows).map(k=>openWindows[k]).find(id=>document.getElementById(id)?.querySelector("#fileContent")) )?.value||f.content;
 const el=document.querySelector("#"+openWindows["fileedit"+id]+" #fileContent");
 if(el)f.content=el.value;
 saveAll();toast(T().saved);
}
function deleteFile(id){
 if(!confirm(T().confirmDelete))return;
 const f=files.find(x=>x.id===id);if(!f)return;
 recycle.push(f);
 files=files.filter(x=>x.id!==id);
 if(f.type==="folder"){
  const children=files.filter(x=>x.parent===id);
  children.forEach(c=>recycle.push(c));
  files=files.filter(x=>x.parent!==id);
 }
 saveAll();renderFiles();toast(T().deleted);
}
function openRecycle(){
 const w=appWindow("recycle",T().recycle,"<div id='recycleList'></div>");
 const el=w.querySelector("#recycleList");
 if(!recycle.length){el.textContent=T().emptyRecycle;return}
 recycle.forEach(f=>{
  const row=document.createElement("div");row.className="file-row";
  const name=document.createElement("span");name.style.flex="1";name.textContent=f.name;
  const restore=document.createElement("button");restore.textContent=T().restore;
  restore.onclick=()=>{f.parent=0;files.push(f);recycle=recycle.filter(x=>x!==f);saveAll();openRecycle();toast(T().saved)};
  row.append(name,restore);el.appendChild(row);
 });
}
function openTerminal(){
 const w=appWindow("terminal",T().terminal,`
 <div id="terminalOutput" class="terminal">DAZ Linux V10 [Community Edition]\nType 'help' to see available commands.\n\n</div>
 <div class="terminal-input"><input id="terminalCommand" placeholder="daz@desktop:~$" onkeydown="if(event.key==='Enter')runCommand()">

function runCommand(){
 const input=document.getElementById("terminalCommand");
 const out=document.getElementById("terminalOutput");if(!input||!out)return;
 const cmd=input.value.trim().toLowerCase();input.value="";
 if(cmd==="clear"){out.textContent="";return}
 let result="";
 if(cmd==="help")result=T().terminalHelp;
 else if(cmd==="about")result=T().terminalAbout;
 else if(cmd==="date")result=new Date().toString();
 else if(cmd==="apps")result=apps.map(a=>a.name).join("\n");
 else if(cmd==="ls")result=files.filter(f=>f.parent===0).map(f=>f.name).join("\n")||T().empty;
 else if(cmd==="whoami")result=username;
 else if(cmd==="")return;
 else result=T().unknown;
 out.textContent+="\ndaz@desktop:~$ "+cmd+"\n"+result+"\n";
 out.scrollTop=out.scrollHeight;
}

 </div><p class="small muted">${T().calculatorHelp}</p>`);

function calcKey(k){
 const d=document.getElementById("calcDisplay");if(!d)return;
 if(k==="C"){d.value="";return}
 if(k==="⌫"){d.value=d.value.slice(0,-1);return}
 if(k==="="){
  if(!/^[0-9+\-*/(). ]+$/.test(d.value)){d.value="Error";return}
  try{
   const result=Function('"use strict";return ('+d.value+')')();
   d.value=Number.isFinite(result)?String(result):"Error";
  }catch(e){d.value="Error"}
  return;
 }
 d.value+=k;
}
