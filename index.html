
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAZ Linux V7</title>
<style>
:root {
  --accent:#168cff;
  --bg:#050912;
  --panel:#0b1423;
  --panel2:#101e31;
  --text:#e8f3ff;
  --muted:#8da6c2;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;overflow:hidden;
}
button,input,textarea,select{font:inherit}
button{
  background:var(--panel2);color:var(--text);
  border:1px solid #24415e;border-radius:8px;
  padding:9px 12px;cursor:pointer;
}
button:hover{border-color:var(--accent);background:#18304c}
input,textarea,select{
  background:#07101c;color:var(--text);
  border:1px solid #29425e;border-radius:7px;
  padding:9px;width:100%;outline:none;
}
textarea{min-height:130px;resize:vertical}
a{color:#68b7ff}
#desktop{
  position:fixed;inset:0;
  background:
   radial-gradient(ellipse at 75% 25%,#10355c 0%,transparent 45%),
   radial-gradient(ellipse at 15% 90%,#102447 0%,transparent 45%),
   linear-gradient(135deg,#030711,#07172b);
}
#topbar{
  position:absolute;top:0;left:0;right:0;height:38px;
  background:#07101de8;border-bottom:1px solid #18334f;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 15px;z-index:1000;font-size:13px;
}
.brand{font-weight:bold;color:var(--accent);letter-spacing:2px}
#desktop-icons{
  position:absolute;top:58px;left:18px;
  display:grid;grid-template-columns:repeat(2,82px);gap:18px;
}
.desk-icon{
  text-align:center;cursor:pointer;padding:8px 3px;
  border-radius:9px;font-size:12px;
}
.desk-icon:hover{background:#183b5b99}
.desk-icon .emoji{font-size:32px;display:block;margin-bottom:6px}
#dock{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  display:flex;gap:9px;padding:9px 13px;
  background:#07101ddd;border:1px solid #24425f;
  border-radius:15px;z-index:900;
}
.dock-btn{font-size:21px;padding:8px 10px}
.window{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:min(760px,94vw);height:min(540px,78vh);
  min-width:290px;min-height:220px;
  background:#091422;border:1px solid #285079;
  border-radius:12px;box-shadow:0 15px 55px #000b;
  display:flex;flex-direction:column;overflow:hidden;
}
.win-title{
  height:42px;flex-shrink:0;background:#10233a;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;cursor:move;border-bottom:1px solid #23415e;
}
.win-controls{display:flex;gap:6px}
.win-controls button{padding:4px 9px}
.win-content{padding:15px;overflow:auto;flex:1}
.window iframe{width:100%;height:100%;border:0;background:white}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.card{
  background:var(--panel);border:1px solid #203c59;
  border-radius:10px;padding:13px;
}
.card h3{margin:0 0 9px;color:var(--accent);font-size:15px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.section{margin-bottom:18px}
.section h2{font-size:17px;color:var(--accent)}
.big-number{font-size:27px;font-weight:bold;margin:8px 0}
.progress{height:9px;background:#1b2d42;border-radius:9px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);width:40%}
.list-item{
  display:flex;justify-content:space-between;align-items:center;
  gap:8px;padding:10px;border-bottom:1px solid #1a3047;
}
.list-item button{padding:6px 9px}
#notifications{
  position:absolute;right:15px;top:48px;width:min(320px,90vw);
  z-index:1200;display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
}
.toast{
  background:#10243b;border:1px solid var(--accent);
  border-radius:9px;padding:12px;box-shadow:0 5px 20px #0008;
  animation:appear .2s ease;
}
@keyframes appear{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#boot{
  position:fixed;inset:0;background:#030711;z-index:5000;
  display:flex;align-items:center;justify-content:center;text-align:center;
}
.boot-logo{font-size:38px;font-weight:bold;letter-spacing:7px;color:var(--accent)}
.boot-sub{color:#8da6c2;margin:15px}
.boot-bar{width:220px;height:5px;background:#17283d;margin:25px auto;border-radius:5px;overflow:hidden}
.boot-bar span{display:block;height:100%;width:0;background:var(--accent);animation:load 2.1s forwards}
@keyframes load{to{width:100%}}
.terminal{
  background:#02060c;color:#8ce6ad;padding:13px;
  border-radius:8px;font-family:Consolas,monospace;
  min-height:100%;font-size:13px;
}
#term-output{white-space:pre-wrap;overflow-wrap:anywhere}
.term-line{display:flex;gap:7px;margin-top:10px}
.term-line input{font-family:Consolas,monospace;color:#8ce6ad}
.file-entry{padding:10px;border-bottom:1px solid #1b3047;cursor:pointer}
.file-entry:hover{background:#14263b}
#arcade-search{margin-bottom:12px}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div id="boot">
  <div>
    <div class="boot-logo">DAZ LINUX</div>
    <div class="boot-sub">Custom Cyber Desktop · V7</div>
    <div class="boot-bar"><span></span></div>
    <div class="muted">Iniciando entorno...</div>
  </div>
</div>

<div id="desktop">
  <div id="topbar">
    <div class="brand">◈ DAZ LINUX</div>
    <div id="top-status">V7.0 · SYSTEM READY</div>
    <div id="clock">00:00:00</div>
  </div>

  <div id="desktop-icons">
    <div class="desk-icon" onclick="openApp('files')"><span class="emoji">📁</span>Archivos</div>
    <div class="desk-icon" onclick="openApp('browser')"><span class="emoji">🌐</span>Navegador</div>
    <div class="desk-icon" onclick="openApp('terminal')"><span class="emoji">⌨️</span>Terminal</div>
    <div class="desk-icon" onclick="openApp('arcade')"><span class="emoji">🎮</span>DAZ Arcade</div>
    <div class="desk-icon" onclick="openApp('monitor')"><span class="emoji">📊</span>Monitor</div>
    <div class="desk-icon" onclick="openApp('store')"><span class="emoji">🛍️</span>DAZ Store</div>
    <div class="desk-icon" onclick="openApp('customizer')"><span class="emoji">🎨</span>Apariencia</div>
    <div class="desk-icon" onclick="openApp('settings')"><span class="emoji">⚙️</span>Ajustes</div>
  </div>

  <div id="windows"></div>
  <div id="notifications"></div>

  <div id="dock">
    <button class="dock-btn" onclick="openApp('files')" title="Archivos">📁</button>
    <button class="dock-btn" onclick="openApp('browser')" title="Navegador">🌐</button>
    <button class="dock-btn" onclick="openApp('terminal')" title="Terminal">⌨️</button>
    <button class="dock-btn" onclick="openApp('arcade')" title="Arcade">🎮</button>
    <button class="dock-btn" onclick="openApp('monitor')" title="Monitor">📊</button>
    <button class="dock-btn" onclick="openApp('store')" title="Store">🛍️</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const accentColors = {
  blue:"#168cff", purple:"#a66cff", green:"#25d69a",
  red:"#ff5577", cyan:"#00c9df", orange:"#ff9b42"
};

let zIndex = 10;
let windowCount = 0;
let currentFile = null;

const apps = {
  files:{title:"DAZ File Manager",icon:"📁"},
  browser:{title:"DAZ Browser",icon:"🌐"},
  terminal:{title:"DAZ Terminal",icon:"⌨️"},
  arcade:{title:"DAZ Arcade",icon:"🎮"},
  monitor:{title:"DAZ System Monitor",icon:"📊"},
  store:{title:"DAZ Store",icon:"🛍️"},
  customizer:{title:"DAZ Customizer",icon:"🎨"},
  settings:{title:"DAZ Settings",icon:"⚙️"}
};

function notify(message){
  const box=document.createElement("div");
  box.className="toast";
  box.textContent="◈ "+message;
  $("notifications").appendChild(box);
  setTimeout(()=>box.remove(),3500);
}

function clock(){
  $("clock").textContent=new Date().toLocaleTimeString();
}
setInterval(clock,1000);clock();

setTimeout(()=>{
  $("boot").classList.add("hidden");
  notify("DAZ Linux V7 iniciado correctamente.");
},2300);

function openApp(id){
  if(!apps[id])return;
  const existing=$("win-"+id);
  if(existing){
    existing.classList.remove("hidden");
    existing.style.zIndex=++zIndex;
    return;
  }
  const win=document.createElement("div");
  win.className="window";
  win.id="win-"+id;
  win.style.zIndex=++zIndex;
  win.style.left=(48+(windowCount%5)*2)+"%";
  win.style.top=(49+(windowCount%5)*2)+"%";
  windowCount++;

  const title=document.createElement("div");
  title.className="win-title";
  title.innerHTML=`<span>${apps[id].icon} ${apps[id].title}</span>
    <div class="win-controls">
      <button onclick="minimizeApp('${id}')">—</button>
      <button onclick="closeApp('${id}')">✕</button>
    </div>`;
  win.appendChild(title);

  const content=document.createElement("div");
  content.className="win-content";
  content.id="content-"+id;
  win.appendChild(content);
  $("windows").appendChild(win);
  makeDraggable(win,title);
  renderApp(id,content);
}

function closeApp(id){
  const win=$("win-"+id);
  if(win)win.remove();
}
function minimizeApp(id){
  const win=$("win-"+id);
  if(win)win.classList.add("hidden");
}
function makeDraggable(win,bar){
  let dragging=false,dx=0,dy=0;
  bar.addEventListener("pointerdown",e=>{
    if(e.target.tagName==="BUTTON")return;
    dragging=true;
    dx=e.clientX-win.offsetLeft;
    dy=e.clientY-win.offsetTop;
    win.style.transform="none";
    win.style.zIndex=++zIndex;
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener("pointermove",e=>{
    if(!dragging)return;
    win.style.left=Math.max(0,Math.min(innerWidth-win.offsetWidth,e.clientX-dx))+"px";
    win.style.top=Math.max(38,Math.min(innerHeight-65,e.clientY-dy))+"px";
  });
  bar.addEventListener("pointerup",()=>dragging=false);
}

function renderApp(id,el){
  if(id==="files")renderFiles(el);
  if(id==="browser")renderBrowser(el);
  if(id==="terminal")renderTerminal(el);
  if(id==="arcade")renderArcade(el);
  if(id==="monitor")renderMonitor(el);
  if(id==="store")renderStore(el);
  if(id==="customizer")renderCustomizer(el);
  if(id==="settings")renderSettings(el);
}

/* FILE MANAGER */

function getFiles(){
  return JSON.parse(localStorage.getItem("daz_files")||'[
    {"name":"Welcome.txt","content":"Bienvenido a DAZ Linux V7."},
    {"name":"System-info.txt","content":"DAZ Linux V7 - Custom Cyber Desktop"}
  ]');
}
function saveFiles(files){
  localStorage.setItem("daz_files",JSON.stringify(files));
}
function renderFiles(el){
  el.innerHTML=`
    <h2>📁 DAZ File Manager</h2>
    <p class="muted">Archivos guardados dentro del simulador.</p>
    <div class="row section">
      <button onclick="newFile()">＋ Nuevo archivo</button>
      <button onclick="newFolder()">＋ Nueva carpeta</button>
    </div>
    <div id="file-list"></div>
    <div id="file-editor" class="section"></div>`;
  updateFileList();
}
function updateFileList(){
  const list=$("file-list");
  if(!list)return;
  const files=getFiles();
  list.innerHTML="";
  files.forEach((file,index)=>{
    const item=document.createElement("div");
    item.className="file-entry";
    item.innerHTML=`📄 ${escapeHTML(file.name)}
      <span class="small"> · ${file.folder?"Carpeta":"Archivo"}</span>`;
    item.onclick=()=>editFile(index);
    list.appendChild(item);
  });
}
function newFile(){
  const name=prompt("Nombre del archivo:");
  if(!name)return;
  const files=getFiles();
  files.push({name:name,content:""});
  saveFiles(files);updateFileList();
  notify("Archivo creado.");
}
function newFolder(){
  const name=prompt("Nombre de la carpeta:");
  if(!name)return;
  const files=getFiles();
  files.push({name:name,content:"",folder:true});
  saveFiles(files);updateFileList();
  notify("Carpeta creada.");
}
function editFile(index){
  const files=getFiles(),file=files[index];
  const editor=$("file-editor");
  if(!editor)return;
  currentFile=index;
  if(file.folder){
    editor.innerHTML=`<h3>📂 ${escapeHTML(file.name)}</h3>
      <button onclick="deleteFile(${index})">Eliminar carpeta</button>`;
    return;
  }
  editor.innerHTML=`
    <h3>Editar: ${escapeHTML(file.name)}</h3>
    <textarea id="file-text">${escapeHTML(file.content)}</textarea>
    <div class="row">
      <button onclick="saveFile(${index})">Guardar</button>
      <button onclick="deleteFile(${index})">Eliminar</button>
    </div>`;
}
function saveFile(index){
  const files=getFiles();
  files[index].content=$("file-text").value;
  saveFiles(files);notify("Archivo guardado.");
}
function deleteFile(index){
  if(!confirm("¿Eliminar este elemento?"))return;
  const files=getFiles();files.splice(index,1);
  saveFiles(files);updateFileList();
  $("file-editor").innerHTML="";
  notify("Elemento eliminado.");
}
function escapeHTML(str){
  return String(str).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

/* BROWSER */

function renderBrowser(el){
  el.style.padding="0";
  el.style.display="flex";
  el.style.flexDirection="column";
  el.innerHTML=`
    <div style="padding:10px;display:flex;gap:7px;background:#10233a">
      <input id="browser-url" placeholder="https://example.com">
      <button onclick="goToPage()">Ir</button>
      <button onclick="searchWeb()">Buscar</button>
      <button onclick="newBrowserTab()">＋</button>
    </div>
    <div style="padding:8px" class="small">
      Algunos sitios no permiten mostrarse dentro de esta ventana.
      Usa "Abrir en otra pestaña" si no cargan.
    </div>
    <iframe id="browser-frame" title="Navegador DAZ"></iframe>
    <div style="padding:8px">
      <button onclick="openExternal()">Abrir en otra pestaña ↗</button>
    </div>`;
}
function safeURL(value){
  try{
    const u=new URL(value);
    if(u.protocol!=="http:"&&u.protocol!=="https:")return null;
    return u.href;
  }catch{return null;}
}
function goToPage(){
  const url=safeURL($("browser-url").value);
  if(!url){notify("Escribe una dirección web válida.");return;}
  $("browser-frame").src=url;
}
function searchWeb(){
  const q=$("browser-url").value.trim();
  if(!q)return;
  $("browser-url").value="https://www.google.com/search?q="+encodeURIComponent(q);
  goToPage();
}
function openExternal(){
  const url=safeURL($("browser-url").value);
  if(url)window.open(url,"_blank","noopener");
  else notify("Dirección no válida.");
}
function newBrowserTab(){
  $("browser-url").value="";
  $("browser-frame").src="about:blank";
}

/* ARCADE */

const defaultGames=[
  {name:"Nettleweb",url:"https://nettleweb.pages.dev/",category:"Web"},
  {name:"Chicken Kings Vault",url:"https://wanocapy.github.io/ChickenKingsVault/",category:"Web"},
  {name:"Ballbang Online",url:"https://ballbang-online.github.io/category/action.html",category:"Web"},
  {name:"StudySync",url:"https://studysync.co.uk/",category:"Web"}
];
function getGames(){
  return [...defaultGames,...JSON.parse(localStorage.getItem("daz_extra_games")||"[]")];
}
function renderArcade(el){
  el.innerHTML=`
    <h2>🎮 DAZ Arcade</h2>
    <p class="muted">Tu catálogo de páginas y juegos.</p>
    <input id="arcade-search" placeholder="Buscar..." oninput="filterGames()">
    <div class="row section">
      <input id="game-name" placeholder="Nombre">
      <input id="game-url" placeholder="https://...">
      <button onclick="addGame()">Añadir</button>
    </div>
    <div id="game-list" class="grid"></div>`;
  filterGames();
}
function filterGames(){
  const list=$("game-list");
  if(!list)return;
  const query=($("arcade-search").value||"").toLowerCase();
  list.innerHTML="";
  getGames().filter(g=>g.name.toLowerCase().includes(query))
  .forEach(g=>{
    const card=document.createElement("div");
    card.className="card";
    const h=document.createElement("h3");h.textContent="🎮 "+g.name;
    const p=document.createElement("p");p.className="muted";p.textContent="Página externa";
    const b=document.createElement("button");b.textContent="Abrir sitio ↗";
    b.onclick=()=>window.open(g.url,"_blank","noopener");
    card.append(h,p,b);list.appendChild(card);
  });
}
function addGame(){
  const name=$("game-name").value.trim();
  const url=safeURL($("game-url").value.trim());
  if(!name||!url){notify("Completa el nombre y una URL válida.");return;}
  const extras=JSON.parse(localStorage.getItem("daz_extra_games")||"[]");
  extras.push({name,url,category:"Web"});
  localStorage.setItem("daz_extra_games",JSON.stringify(extras));
  $("game-name").value="";$("game-url").value="";
  filterGames();notify("Añadido al catálogo.");
}

/* SYSTEM MONITOR */

function renderMonitor(el){
  el.innerHTML=`
    <h2>📊 DAZ System Monitor</h2>
    <p class="muted">Estadísticas ficticias para la demostración del escritorio.</p>
    <div class="grid">
      <div class="card"><h3>CPU</h3><div class="big-number" id="cpu">32%</div><div class="progress"><span id="cpu-bar"></span></div></div>
      <div class="card"><h3>RAM</h3><div class="big-number" id="ram">48%</div><div class="progress"><span id="ram-bar"></span></div></div>
      <div class="card"><h3>Disco</h3><div class="big-number">64%</div><div class="progress"><span style="width:64%"></span></div></div>
      <div class="card"><h3>Red</h3><div class="big-number" id="network">12 Mbps</div><p class="muted">Valor simulado</p></div>
    </div>
    <div class="card section">
      <h3>Actividad del sistema</h3>
      <div id="monitor-log" class="muted">Sistema iniciado. Esperando datos...</div>
    </div>
    <button onclick="refreshMonitor()">Actualizar</button>`;
  refreshMonitor();
}
function refreshMonitor(){
  const cpu=Math.floor(10+Math.random()*75);
  const ram=Math.floor(25+Math.random()*60);
  const net=Math.floor(Math.random()*90);
  if(!$("cpu"))return;
  $("cpu").textContent=cpu+"%";$("cpu-bar").style.width=cpu+"%";
  $("ram").textContent=ram+"%";$("ram-bar").style.width=ram+"%";
  $("network").textContent=net+" Mbps";
  $("monitor-log").textContent="Actualizado: "+new Date().toLocaleTimeString()+" · Datos de demostración.";
}

/* STORE */

const storeApps=[
  {id:"notes",name:"DAZ Notes",icon:"📝",description:"Bloc de notas de demostración."},
  {id:"paint",name:"DAZ Paint",icon:"🎨",description:"Herramienta creativa simulada."},
  {id:"calendar",name:"DAZ Calendar",icon:"📅",description:"Calendario de demostración."},
  {id:"games",name:"DAZ Mini Games",icon:"🕹️",description:"Colección de juegos futuros."},
  {id:"system",name:"DAZ System Tools",icon:"🛠️",description:"Herramientas del entorno."}
];
function getInstalled(){
  return JSON.parse(localStorage.getItem("daz_installed")||'["notes","system"]');
}
function renderStore(el){
  el.innerHTML=`
    <h2>🛍️ DAZ Store</h2>
    <p class="muted">Tienda de aplicaciones ficticias. Las instalaciones no descargan programas reales.</p>
    <div id="store-list" class="grid"></div>`;
  updateStore();
}
function updateStore(){
  const list=$("store-list");if(!list)return;
  const installed=getInstalled();
  list.innerHTML="";
  storeApps.forEach(app=>{
    const card=document.createElement("div");card.className="card";
    const h=document.createElement("h3");h.textContent=app.icon+" "+app.name;
    const p=document.createElement("p");p.className="muted";p.textContent=app.description;
    const b=document.createElement("button");
    b.textContent=installed.includes(app.id)?"Desinstalar":"Instalar";
    b.onclick=()=>toggleInstall(app.id);
    card.append(h,p,b);list.appendChild(card);
  });
}
function toggleInstall(id){
  let installed=getInstalled();
  if(installed.includes(id))installed=installed.filter(x=>x!==id);
  else installed.push(id);
  localStorage.setItem("daz_installed",JSON.stringify(installed));
  updateStore();notify("Estado de aplicación actualizado.");
}

/* CUSTOMIZER */

function renderCustomizer(el){
  el.innerHTML=`
    <h2>🎨 DAZ Customizer</h2>
    <div class="section">
      <h3>Color de acento</h3>
      <div class="row">
        ${Object.entries(accentColors).map(([name,color])=>
          `<button style="border-color:${color}" onclick="setAccent('${name}')">${name}</button>`
        ).join("")}
      </div>
    </div>
    <div class="section">
      <h3>Fondo del escritorio</h3>
      <div class="grid">
        <button onclick="setWallpaper('blue')">Cyber Blue</button>
        <button onclick="setWallpaper('purple')">Purple Night</button>
        <button onclick="setWallpaper('green')">Matrix Green</button>
        <button onclick="setWallpaper('black')">Pure Black</button>
      </div>
    </div>
    <div class="section">
      <h3>Nombre del escritorio</h3>
      <input id="custom-name" placeholder="DAZ Linux">
      <button onclick="setDesktopName()">Guardar nombre</button>
    </div>
    <button onclick="resetAppearance()">Restaurar apariencia</button>`;
}
function setAccent(name){
  document.documentElement.style.setProperty("--accent",accentColors[name]);
  localStorage.setItem("daz_accent",name);
  notify("Color actualizado.");
}
function setWallpaper(name){
  const backgrounds={
    blue:"radial-gradient(ellipse at 75% 25%,#10355c,transparent 45%),linear-gradient(135deg,#030711,#07172b)",
    purple:"radial-gradient(ellipse at 75% 25%,#49246e,transparent 45%),linear-gradient(135deg,#080411,#211032)",
    green:"radial-gradient(ellipse at 75% 25%,#145b3b,transparent 45%),linear-gradient(135deg,#020a08,#092319)",
    black:"linear-gradient(135deg,#000,#080808)"
  };
  $("desktop").style.background=backgrounds[name];
  localStorage.setItem("daz_wallpaper",name);
  notify("Fondo actualizado.");
}
function setDesktopName(){
  const name=$("custom-name").value.trim();
  if(!name)return;
  $("top-status").textContent=name+" · V7";
  localStorage.setItem("daz_desktop_name",name);
  notify("Nombre actualizado.");
}
function resetAppearance(){
  localStorage.removeItem("daz_accent");
  localStorage.removeItem("daz_wallpaper");
  localStorage.removeItem("daz_desktop_name");
  location.reload();
}
function loadAppearance(){
  const accent=localStorage.getItem("daz_accent");
  const wallpaper=localStorage.getItem("daz_wallpaper");
  const name=localStorage.getItem("daz_desktop_name");
  if(accent&&accentColors[accent]){
    document.documentElement.style.setProperty("--accent",accentColors[accent]);
  }
  if(wallpaper)setWallpaper(wallpaper);
  if(name)$("top-status").textContent=name+" · V7";
}

/* SETTINGS */

function renderSettings(el){
  el.innerHTML=`
    <h2>⚙️ Ajustes</h2>
    <div class="card section">
      <h3>Información del sistema</h3>
      <p>Nombre: DAZ Linux</p>
      <p>Versión: 7.0 Custom Cyber Desktop</p>
      <p>Entorno: Web Desktop Simulator</p>
      <p>Motor: HTML / CSS / JavaScript</p>
    </div>
    <div class="card section">
      <h3>Almacenamiento</h3>

    </div>
    <button onclick="notify('DAZ Linux está funcionando.')">Comprobar sistema</button>`;
}

/* TERMINAL */

function renderTerminal(el){
  el.innerHTML=`
    <div class="terminal">
      <div id="term-output">DAZ Linux Terminal V2
Type 'help' for available commands.
-----------------------------------</div>
      <div class="term-line">
        <span>user@daz:~$</span>
        <input id="term-input" autocomplete="off" spellcheck="false" placeholder="Escribe un comando...">
        <button onclick="runTerminal()">Enter</button>
      </div>
    </div>`;
  $("term-input").addEventListener("keydown",e=>{
    if(e.key==="Enter")runTerminal();
  });
}
function terminalWrite(text){
  const out=$("term-output");
  if(!out)return;
  out.textContent+="\n"+text;
  out.scrollTop=out.scrollHeight;
}
function runTerminal(){
  const input=$("term-input");
  if(!input)return;
  const cmd=input.value.trim().toLowerCase();
  if(!cmd)return;
  input.value="";
  terminalWrite("\nuser@daz:~$ "+cmd);

  const commands={
    help:`Comandos disponibles:
help, clear, whoami, date, pwd, ls, uname,
neofetch, matrix, hack-demo, scan-demo,
trace-demo, daz-log, azuka, zoravka,
azuka + zoravka`,
    whoami:"user",
    pwd:"/home/user",
    ls:"Desktop  Documents  Downloads  Pictures  DAZ",
    uname:"DAZ Linux 7.0 Web Desktop Simulator",
    date:new Date().toString(),
    neofetch:`   ◈ DAZ LINUX
   OS: DAZ Linux V7
   Kernel: Web Simulator
   Desktop: DAZ Custom
   Theme: Cyber Blue
   Terminal: DAZ Terminal V2`,
    matrix:"[DEMO] Matrix visual iniciado. Simulación local.",
    "hack-demo":"[DEMO] Secuencia visual ficticia. No se accede a sistemas.",
    "scan-demo":"[DEMO] Escaneo ficticio de datos de muestra. Sin escaneo de red.",
    "trace-demo":"[DEMO] Ruta de ejemplo: NODE-01 → NODE-02 → DAZ.",
    "daz-log":"[DAZ LOG] System ready.\n[DAZ LOG] Desktop loaded.\n[DAZ LOG] Arcade initialized.\n[DAZ LOG] User session active.",
    azuka:"AZUKA SOLVANSKI\nEstado: tranquila.\nExpresión: sarcástica.\nSistema: OK.",
    zoravka:"ZORAVKA VELSTRANI\nEstado: tranquila.\nEstilo: Balkan Hardbass.\nSistema: OK.",
    "azuka + zoravka":"DAZ CHARACTER DATA\nAzuka + Zoravka\nAmbas están en línea."
  };
  if(cmd==="clear"){$("term-output").textContent="DAZ Linux Terminal V2";return;}
  terminalWrite(commands[cmd]||"Comando no reconocido. Escribe help.");
}

loadAppearance();
notify("Bienvenido a DAZ Linux V7.");
</script>
