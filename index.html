
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAZ Linux V9</title>
<style>
:root{
 --bg:#101114;--panel:#191b20;--panel2:#22252c;
 --text:#eeeeef;--muted:#9298a4;--accent:#8aa9d8;
 --border:#30343d;--danger:#d66b75;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font:14px Arial,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit}
button{background:var(--panel2);color:var(--text);
 border:1px solid var(--border);border-radius:8px;
 padding:9px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
input,textarea,select{background:#111318;color:var(--text);
 border:1px solid var(--border);border-radius:7px;padding:9px}
#topbar{height:42px;background:#191b20;border-bottom:1px solid var(--border);
 display:flex;align-items:center;justify-content:space-between;padding:0 14px}
#desktop{height:calc(100vh - 42px);padding:20px;
 background:radial-gradient(ellipse at 50% 50%,#20242b,#101114 70%)}
#icons{display:grid;grid-template-columns:repeat(auto-fill,85px);gap:14px}
.dicon{height:85px;border:1px solid transparent;border-radius:10px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:8px;cursor:pointer;text-align:center}
.dicon:hover{background:#ffffff0b;border-color:var(--border)}
.dicon span:first-child{font-size:27px}
#dock{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
 display:flex;gap:7px;padding:9px;background:#191b20eF;
 border:1px solid var(--border);border-radius:13px}
.window{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:min(700px,94vw);height:min(520px,80vh);background:var(--panel);
 border:1px solid var(--border);border-radius:12px;
 box-shadow:0 18px 60px #0009;display:flex;flex-direction:column;overflow:hidden}
.wtitle{height:42px;background:#20232a;display:flex;align-items:center;
 justify-content:space-between;padding:0 12px;flex-shrink:0}
.wbody{padding:15px;overflow:auto;flex:1}
.close{background:#39252a;color:#f4b5bb}
.card{background:var(--panel2);border:1px solid var(--border);
 border-radius:10px;padding:13px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.big{font-size:28px;font-weight:bold}
#boot,#login{position:fixed;inset:0;background:#101114;z-index:9999;
 display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px}
#login{display:none}
.hidden{display:none!important}
a{color:var(--accent)}
canvas{background:white;max-width:100%;touch-action:none;border-radius:6px}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
#termout{background:#090a0c;padding:12px;border-radius:8px;height:300px;overflow:auto;color:#b8d0ba}
#termline{width:100%}
@media(max-width:600px){
 #dock{max-width:95vw;overflow:auto}
 .window{height:78vh}
}
</style>
</head>
<body>

<div id="boot">
 <div class="big">DAZ LINUX</div>
 <div class="muted">Version 9.0 · Minimal Edition</div>
 <div>Starting desktop...</div>
</div>

<div id="login" class="hidden">
 <div class="big">DAZ Linux</div>
 <p class="muted">Welcome back</p>
 <input id="username" placeholder="Username" value="User">
 <button onclick="login()">Enter desktop</button>
</div>

<div id="topbar">
 <b>DAZ Linux V9</b>
 <span id="clock">--:--</span>
</div>

<div id="desktop">
 <div id="icons"></div>
</div>
<div id="dock"></div>
<div id="windows"></div>

<script>
"use strict";

/* ---------- DAZ CORE ---------- */

const apps = [
 ["control","⚙️","Control Center"],
 ["paint","🎨","DAZ Paint"],
 ["music","🎵","DAZ Music"],
 ["recovery","🛟","DAZ Recovery"],
 ["widgets","🕒","Desktop Widgets"],
 ["files","📁","File Explorer"],
 ["calculator","🧮","Calculator"],
 ["gallery","🖼️","DAZ Gallery"],
 ["bootmanager","🚀","Boot Manager"],
 ["store","🛍️","DAZ App Store"],
 ["achievements","🏆","Achievements"],
 ["cloud","☁️","DAZ Cloud"],
 ["themes","🎨","DAZ Themes"],
 ["kiwi","🥝","Kiwi Links"],
 ["nettle","🌐","Nettle Web"],
 ["gaming","🎮","DAZ Gaming Hub"],
 ["terminal","⌨️","Terminal"]
];

let zIndex=10;
let sessionStart=Date.now();
let gaming=false;
let visitCounts=JSON.parse(localStorage.getItem("dazVisits")||"{}");

const $=id=>document.getElementById(id);
const safe=(s)=>String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function initDesktop(){
 $("icons").innerHTML=apps.map(a=>`
 <div class="dicon" ondblclick="openApp('${a[0]}')"
 onclick="selectIcon(this)">
 <span>${a[1]}</span><span>${a[2]}</span></div>`).join("");
 $("dock").innerHTML=apps.slice(0,8).map(a=>
 `<button title="${a[2]}" onclick="openApp('${a[0]}')">${a[1]}</button>`
 ).join("");
}

function selectIcon(el){
 document.querySelectorAll(".dicon").forEach(x=>x.style.background="");
 el.style.background="#ffffff18";
}

function openApp(id){
 const app=apps.find(a=>a[0]===id);
 if(!app)return;
 const win=document.createElement("section");
 win.className="window";
 win.style.zIndex=++zIndex;
 win.innerHTML=`
 <div class="wtitle">
 <b>${app[1]} ${app[2]}</b>
 <button class="close" onclick="this.closest('.window').remove()">✕</button>
 </div><div class="wbody" id="body-${id}"></div>`;
 $("windows").appendChild(win);
 win.addEventListener("mousedown",()=>win.style.zIndex=++zIndex);
 try{renderApp(id,win.querySelector(".wbody"))}
 catch(e){
 console.error("DAZ app error:",id,e);
 win.querySelector(".wbody").innerHTML=
 `<h3>Application error</h3><pre>${safe(e.stack||e)}</pre>`;
 }
}

function renderApp(id,el){
 const renderers={
 control:renderControl,paint:renderPaint,music:renderMusic,
 recovery:renderRecovery,widgets:renderWidgets,files:renderFiles,
 calculator:renderCalculator,gallery:renderGallery,
 bootmanager:renderBoot,store:renderStore,
 achievements:renderAchievements,cloud:renderCloud,
 themes:renderThemes,kiwi:renderKiwi,nettle:renderNettle,
 gaming:renderGaming,terminal:renderTerminal
 };
 if(!renderers[id]){
  el.textContent="Application not found";
  return;
 }
 renderers[id](el);
}

/* ---------- INDEXED DB ---------- */

let db;
function openDB(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open("DAZLinuxV9",1);
  request.onupgradeneeded=()=>{
   const d=request.result;
   ["files","drawings","gallery","playlists"].forEach(name=>{
    if(!d.objectStoreNames.contains(name))
     d.createObjectStore(name,{keyPath:"id",autoIncrement:true});
   });
  };
  request.onsuccess=()=>{db=request.result;resolve(db)};
  request.onerror=()=>reject(request.error);
 });
}
function saveRecord(store,data){
 return new Promise((resolve,reject)=>{
  if(!db)return reject(Error("Database unavailable"));
  const tx=db.transaction(store,"readwrite");
  tx.objectStore(store).add(data);
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
 });
}
function getRecords(store){
 return new Promise((resolve,reject)=>{
  if(!db)return reject(Error("Database unavailable"));
  const tx=db.transaction(store,"readonly");
  const req=tx.objectStore(store).getAll();
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
}
function clearStore(store){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(store,"readwrite");
  tx.objectStore(store).clear();
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
 });
}

/* ---------- CONTROL CENTER ---------- */

function renderControl(el){
 el.innerHTML=`
 <h2>Control Center</h2>
 <div class="grid">
 <div class="card"><b>System</b><p>DAZ Linux V9</p><span class="muted">Minimal Edition</span></div>
 <div class="card"><b>Session</b><p id="sessiontime">Active</p></div>
 <div class="card"><b>Storage</b><p>Browser IndexedDB</p></div>
 <div class="card"><b>Gaming</b><p>${gaming?"Enabled":"Disabled"}</p></div>
 </div>
 <button onclick="openApp('themes')">Appearance</button>
 <button onclick="openApp('widgets')">Widgets</button>`;
}

/* ---------- PAINT ---------- */

function renderPaint(el){
 el.innerHTML=`
 <h2>DAZ Paint</h2>
 <div class="row">
 <input type="color" id="paintcolor" value="#111111">
 <input type="range" id="brushsize" min="1" max="40" value="5">
 <button onclick="clearPaint()">Clear</button>
 <button onclick="savePaint()">Save PNG</button>
 </div><br>
 <canvas id="paintcanvas" width="650" height="350"></canvas>`;
 const c=$("paintcanvas"),ctx=c.getContext("2d");
 ctx.fillStyle="white";ctx.fillRect(0,0,c.width,c.height);
 let drawing=false;
 function pos(e){
  const r=c.getBoundingClientRect();
  return {x:(e.clientX-r.left)*c.width/r.width,
          y:(e.clientY-r.top)*c.height/r.height};
 }
 c.onpointerdown=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{
  if(!drawing)return;
  const p=pos(e);ctx.lineWidth=$("brushsize").value;
  ctx.lineCap="round";ctx.strokeStyle=$("paintcolor").value;
  ctx.lineTo(p.x,p.y);ctx.stroke();
 };
 c.onpointerup=()=>drawing=false;
 c.onpointercancel=()=>drawing=false;
}
function clearPaint(){
 const c=$("paintcanvas");if(!c)return;
 const ctx=c.getContext("2d");ctx.fillStyle="white";ctx.fillRect(0,0,c.width,c.height);
}
async function savePaint(){
 const c=$("paintcanvas");if(!c)return;
 const blob=await new Promise(r=>c.toBlob(r,"image/png"));
 await saveRecord("drawings",{name:"DAZ drawing",blob,date:new Date().toISOString()});
 alert("Drawing saved in DAZ storage.");
}

/* ---------- MUSIC ---------- */

let audioObject=null;
function renderMusic(el){
 el.innerHTML=`
 <h2>DAZ Music</h2>
 <p class="muted">Play audio files from your device.</p>
 <input type="file" id="audiofile" accept="audio/*">
 <audio id="player" controls style="width:100%;margin-top:15px"></audio>
 <p id="audioname" class="muted">No audio selected</p>`;
 $("audiofile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  if(audioObject)URL.revokeObjectURL(audioObject);
  audioObject=URL.createObjectURL(f);
  $("player").src=audioObject;$("audioname").textContent=f.name;
 };
}

/* ---------- RECOVERY ---------- */

async function renderRecovery(el){
 el.innerHTML=`
 <h2>DAZ Recovery</h2>
 <p>Export a backup of your DAZ settings and files.</p>
 <button onclick="exportBackup()">Export backup</button>
 <p class="muted">Importing a backup replaces the stored DAZ data.</p>
 <input type="file" id="backupfile" accept="application/json">
 <button onclick="importBackup()">Import backup</button>
 <hr><button class="close" onclick="resetSettings()">Reset appearance settings</button>`;
}
function downloadJSON(obj,name){
 const blob=new Blob([JSON.stringify(obj)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download=name;a.click();URL.revokeObjectURL(a.href);
}
async function exportBackup(){
 const backup={version:9,settings:{...localStorage},
 stores:{}};
 for(const s of ["files","drawings","gallery","playlists"])
  backup.stores[s]=await getRecords(s);
 downloadJSON(backup,"daz-linux-backup.json");
}
async function importBackup(){
 const f=$("backupfile").files[0];if(!f)return alert("Choose a backup first.");
 try{
  const b=JSON.parse(await f.text());
  if(b.version!==9||!b.stores)throw Error("Invalid backup");
  if(!confirm("Replace current DAZ data with this backup?"))return;
  for(const s of Object.keys(b.stores)){
   await clearStore(s);
   for(const item of b.stores[s]){
    await new Promise((resolve,reject)=>{
     const tx=db.transaction(s,"readwrite");
     tx.objectStore(s).put(item);
     tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
   }
  }
  alert("Backup imported.");
 }catch(e){alert("Import failed: "+e.message)}
}
function resetSettings(){
 if(!confirm("Reset DAZ appearance settings?"))return;
 ["dazAccent","dazWallpaper"].forEach(k=>localStorage.removeItem(k));
 location.reload();
}

/* ---------- WIDGETS ---------- */

function renderWidgets(el){
 el.innerHTML=`
 <h2>Desktop Widgets</h2>
 <div class="card"><h3>Clock</h3><div class="big" id="widgetclock">--:--:--</div><p id="widgetdate"></p></div>
 <div class="card"><h3>Quick Notes</h3>
 <textarea id="quicknote" rows="5" style="width:100%" placeholder="Write a note..."></textarea>
 <button onclick="saveNote()">Save note</button></div>`;
 $("quicknote").value=localStorage.getItem("dazNote")||"";
 updateWidgetClock();
}
function updateWidgetClock(){
 const c=$("widgetclock");if(!c)return;
 const d=new Date();
 c.textContent=d.toLocaleTimeString();
 $("widgetdate").textContent=d.toLocaleDateString();
}
function saveNote(){
 localStorage.setItem("dazNote",$("quicknote").value);
 alert("Note saved.");
}

/* ---------- FILE EXPLORER ---------- */

async function renderFiles(el){
 el.innerHTML=`
 <h2>DAZ File Explorer</h2>
 <div class="row"><input id="newfilename" placeholder="File name">
 <button onclick="createFile()">Create</button></div>
 <div id="filelist">Loading...</div>`;
 await refreshFiles();
}
async function refreshFiles(){
 const target=$("filelist");if(!target)return;
 const items=await getRecords("files");
 target.innerHTML=items.length?items.map(f=>`
 <div class="card row"><span style="flex:1">${safe(f.name)}</span>
 <button onclick="renameFile(${f.id})">Rename</button>
 <button onclick="deleteFile(${f.id})">Delete</button></div>`).join(""):"No files yet.";
}
async function createFile(){
 const name=$("newfilename").value.trim();if(!name)return;
 await saveRecord("files",{name,content:""});
 $("newfilename").value="";refreshFiles();
}
async function deleteFile(id){
 if(!confirm("Delete this file?"))return;
 const tx=db.transaction("files","readwrite");tx.objectStore("files").delete(id);
 tx.oncomplete=refreshFiles;
}
async function renameFile(id){
 const all=await getRecords("files"),f=all.find(x=>x.id===id);if(!f)return;
 const name=prompt("New name:",f.name);if(!name)return;
 const tx=db.transaction("files","readwrite");
 tx.objectStore("files").put({...f,name});
 tx.oncomplete=refreshFiles;
}

/* ---------- CALCULATOR ---------- */

function renderCalculator(el){
 el.innerHTML=`
 <h2>DAZ Calculator</h2>
 <input id="calcdisplay" readonly value="0" style="width:100%;font-size:25px;text-align:right">
 <div class="grid" style="margin-top:12px">
 ${["7","8","9","/","4","5","6","*","1","2","3","-","0",".","=","+","C"].map(x=>
 `<button onclick="calcPress('${x}')">${x}</button>`).join("")}
 </div>`;
}
function calcPress(x){
 const d=$("calcdisplay");if(!d)return;
 if(x==="C"){d.value="0";return}
 if(x==="="){
  try{
   if(!/^[0-9+*/.() -]+$/.test(d.value))throw Error();
   const result=Function('"use strict";return ('+d.value+')')();
   if(!Number.isFinite(result))throw Error();
   d.value=String(result);
  }catch(e){d.value="Error"}
  return;
 }
 d.value=d.value==="0"?x:d.value+x;
}

/* ---------- GALLERY ---------- */

async function renderGallery(el){
 el.innerHTML=`
 <h2>DAZ Gallery</h2>
 <input id="galleryfile" type="file" accept="image/*">
 <button onclick="addGallery()">Add image</button>
 <div id="galleryitems" class="grid" style="margin-top:15px"></div>`;
 await refreshGallery();
}
async function addGallery(){
 const f=$("galleryfile").files[0];if(!f)return;
 if(f.size>5*1024*1024)return alert("Maximum image size is 5 MB.");
 const data=await new Promise(resolve=>{
  const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f);
 });
 await saveRecord("gallery",{name:f.name,data});
 refreshGallery();
}
async function refreshGallery(){
 const box=$("galleryitems");if(!box)return;
 const all=await getRecords("gallery");
 box.innerHTML=all.map(x=>`
 <div class="card"><img src="${x.data}" style="width:100%;border-radius:6px">
 <p>${safe(x.name)}</p></div>`).join("")||"No images yet.";
}

 el.innerHTML=`
 <h2>DAZ Boot Manager</h2>

 <select id="bootstyle">
 <option value="classic">Classic quick start</option>

/* ---------- APP STORE ---------- */

const storeApps=["DAZ Paint","DAZ Music","DAZ Gallery","DAZ Calculator","DAZ Notes"];
function renderStore(el){
 el.innerHTML="<h2>DAZ App Store</h2><p class='muted'>Local app catalog</p>"+

 let list=JSON.parse(localStorage.getItem("dazInstalled")||"[]");
 if(!list.includes(n))list.push(n);

 el.innerHTML=`
 <h2>DAZ Themes</h2>
 <div class="card"><label>Accent color</label><br>
 <input type="color" id="accent" value="${localStorage.getItem("dazAccent")||"#8aa9d8"}">
 <button onclick="saveTheme()">Apply</button></div>

function saveTheme(){
 const v=$("accent").value;localStorage.setItem("dazAccent",v);
 document.documentElement.style.setProperty("--accent",v);
}
function saveWallpaper(){
 const v=$("wallpaper").value;localStorage.setItem("dazWallpaper",v);

}
function applyWallpaper(){
 const v=localStorage.getItem("dazWallpaper")||"default";
 $("desktop").style.background=v==="black"?"#050505":

/* ---------- KIWI LINKS ---------- */

const kiwiLinks=[
 ["StudySync","https://studysync.co.uk/"],
 ["Classwork Cloud","https://classwork.cloud/"],
 ["Kiwi","https://kiwi.at.it/"],
 ["Classwork US","https://classwork.us.com/"],
 ["Learning","https://learning.com.de/"],
 ["Biology","https://biology.us.com/"]
];
function recordVisit(name){
 visitCounts[name]=(visitCounts[name]||0)+1;

function launchLink(name,url){
 recordVisit(name);

}

 <p class="muted">Your saved external links.</p>
 <div class="grid">${kiwiLinks.map(x=>`
 <div class="card"><b>${safe(x[0])}</b>

 <small class="muted">Visits: ${visitCounts[x[0]]||0}</small></div>`).join("")}</div>`;

 <h3>Nettle Web</h3>
 <p class="muted">Dedicated external page.</p>

/* ---------- GAMING HUB ---------- */

function renderGaming(el){
 el.innerHTML=`
 <h2>DAZ Gaming Hub</h2>
 <div class="grid">
 <div class="card"><h3>Game Time</h3>
 <div class="big" id="gametime">00:00:00</div>
 <button onclick="startGameTimer()">Start</button>
 <button onclick="pauseGameTimer()">Pause</button>
 <button onclick="resetGameTimer()">Reset</button></div>
 <div class="card"><h3>Gaming Mode</h3>
 <p id="gamingstatus">${gaming?"Enabled":"Disabled"}</p>
 <button onclick="toggleGaming()">Toggle mode</button></div>
 <div class="card"><h3>Visit Counter</h3>
 <p>Total launches: ${Object.values(visitCounts).reduce((a,b)=>a+b,0)}</p>
 ${Object.entries(visitCounts).map(x=>`<p>${safe(x[0])}: ${x[1]}</p>`).join("")}
 </div>
 </div>
 <h3>Quick launch</h3>
 <button onclick="openApp('kiwi')">Kiwi Links</button>
 <button onclick="openApp('nettle')">Nettle Web</button>`;
 updateGameTimer();
}
let timerElapsed=0,timerStarted=0,timerInterval=null;
function startGameTimer(){
 if(timerInterval)return;
 timerStarted=Date.now();
 timerInterval=setInterval(updateGameTimer,1000);
}
function pauseGameTimer(){
 if(!timerInterval)return;
 timerElapsed+=Date.now()-timerStarted;
 clearInterval(timerInterval);timerInterval=null;updateGameTimer();
}
function resetGameTimer(){
 pauseGameTimer();timerElapsed=0;updateGameTimer();
}
function updateGameTimer(){
 const el=$("gametime");if(!el)return;
 let ms=timerElapsed+(timerInterval?Date.now()-timerStarted:0);
 const sec=Math.floor(ms/1000);
 el.textContent=[Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60]
 .map(n=>String(n).padStart(2,"0")).join(":");
}
function toggleGaming(){
 gaming=!gaming;
 document.body.classList.toggle("gaming",gaming);
 const el=$("gamingstatus");if(el)el.textContent=gaming?"Enabled":"Disabled";
 localStorage.setItem("dazGaming",gaming?"1":"0");
}

/* ---------- TERMINAL ---------- */

function renderTerminal(el){
 el.innerHTML=`
 <h2>DAZ Terminal</h2>
 <div id="termout">DAZ Linux V9 terminal simulation.<br>Type help for commands.</div>
 <input id="termline" placeholder="Enter command...">
 <button onclick="runTerminal()">Run</button>`;
 $("termline").addEventListener("keydown",e=>{if(e.key==="Enter")runTerminal()});
}
function runTerminal(){
 const input=$("termline"),out=$("termout");if(!input||!out)return;
 const cmd=input.value.trim().toLowerCase();input.value="";
 const commands={
 help:"Commands: help, whoami, pwd, ls, date, uname, neofetch, matrix, clear, azuka, zoravka, azuka + zoravka, daz-log, hack-demo, scan-demo, trace-demo",
 whoami:"daz-user",
 pwd:"/home/daz",
 ls:"Desktop Documents Downloads Pictures Music",
 date:new Date().toString(),
 uname:"DAZ Linux V9 Browser Edition",
 neofetch:"DAZ Linux V9 | Minimal Edition | Browser desktop simulator",
 matrix:"[SIMULATION] Matrix visual effect unavailable in this terminal.",
 "azuka":"Azuka Solvanski: calm, sarcastic, green eyes, burgundy hair.",
 "zoravka":"Zoravka Velstrani: calm, sarcastic, silver-blonde hair, ice-blue eyes.",
 "azuka + zoravka":"DAZ character connection: Azuka + Zoravka.",
 "daz-log":"[SIMULATION] DAZ system log: all demo services nominal.",
 "hack-demo":"[SIMULATION] No system access performed.",
 "scan-demo":"[SIMULATION] No network scan performed.",
 "trace-demo":"[SIMULATION] No tracking or tracing performed."
 };
 if(cmd==="clear"){out.innerHTML="";return}
 const result=commands[cmd]||"Command not found. Type help.";
 out.innerHTML+="<br><span style='color:#8aa9d8'>daz@linux:~$</span> "+safe(cmd)+
 "<br>"+safe(result);
 out.scrollTop=out.scrollHeight;
}

/* ---------- DESKTOP SHORTCUTS ---------- */

function updateClock(){
 $("clock").textContent=new Date().toLocaleTimeString([],{
 hour:"2-digit",minute:"2-digit"
 });
}
function addShortcuts(){
 const saved=JSON.parse(localStorage.getItem("dazShortcuts")||"[]");
 saved.forEach(id=>{
  const app=apps.find(a=>a[0]===id);if(!app)return;
  const d=document.createElement("div");d.className="dicon";
  d.innerHTML=`<span>${app[1]}</span><span>${app[2]}</span>`;
  d.ondblclick=()=>openApp(id);$("icons").appendChild(d);
 });
}

/* ---------- BOOT / LOGIN ---------- */

function login(){
 $("login").classList.add("hidden");
 $("topbar").classList.remove("hidden");
 $("desktop").classList.remove("hidden");
 $("dock").classList.remove("hidden");
 initDesktop();addShortcuts();applyWallpaper();
 document.documentElement.style.setProperty("--accent",
 localStorage.getItem("dazAccent")||"#8aa9d8");
}
async function startSystem(){
 try{await openDB()}
 catch(e){console.error("IndexedDB unavailable",e)}
 gaming=localStorage.getItem("dazGaming")==="1";
 $("boot").classList.add("hidden");
 $("login").classList.remove("hidden");
}
$("topbar").classList.add("hidden");
$("desktop").classList.add("hidden");
$("dock").classList.add("hidden");
setInterval(updateClock,1000);
updateClock();
setInterval(updateWidgetClock,1000);
setInterval(()=>{
 const el=$("sessiontime");
 if(el)el.textContent=Math.floor((Date.now()-sessionStart)/60000)+" min";
},1000);
applyWallpaper();
startSystem();
